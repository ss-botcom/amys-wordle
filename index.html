<!-- ═══════════════════════════════════════════════════════════════════
   SLEPT DAY · September 30 · "SLEPT"
   Paste this whole block (and the SPICY block under it) at the very
   bottom of index.html, right before the closing </body> tag,
   i.e. right after the FROTH DAY block.

   Needs:  toast/amy-4.png   (the glasses / finger-on-lip photo)

   Runs only on the date set in SLEPT_DAY. Any other day: does nothing.
   Test it early with:  index.html?peek=09-30&fresh=1
   ═══════════════════════════════════════════════════════════════════ -->
<style>
  /* everything is scoped to body.sleptday so no other day can be touched */

  /* ---------- the intro: 3am, full screen ---------- */
  body.sleptday .sl-stage {
    position: fixed;
    inset: 0;
    z-index: 58;
    overflow: hidden;
    cursor: pointer;
    background: radial-gradient(ellipse at 50% 45%, #3A2E3E 0%, #221A24 60%, #16111A 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.3rem;
    transition: opacity 0.45s ease;
  }
  body.sleptday .sl-stage.clearing { opacity: 0; }

  body.sleptday .sl-bigclock {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 3.2rem;
    line-height: 1;
    color: #F3D7DA;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px rgba(217, 160, 165, 0.55);
  }
  body.sleptday .sl-bigclock small { font-size: 1rem; margin-left: 0.35rem; opacity: 0.7; }

  body.sleptday .sl-glow {
    position: relative;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid rgba(253, 251, 247, 0.18);
    box-shadow: 0 0 44px 12px rgba(140, 170, 255, 0.35);
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.2, 0.8, 0.3, 1.2);
  }
  body.sleptday .sl-glow.show { opacity: 1; transform: scale(1); }
  body.sleptday .sl-glow img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 55% 55%;
    filter: brightness(0.92) saturate(0.7);
  }
  body.sleptday .sl-glow::after {        /* blue phone light on her face */
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 75%, rgba(150, 180, 255, 0.3), rgba(40, 50, 90, 0.3));
    mix-blend-mode: screen;
  }

  body.sleptday .sl-cap {
    width: min(320px, 84vw);
    min-height: 2.4rem;
    text-align: center;
    font-family: 'Great Vibes', cursive;
    font-size: 1.85rem;
    line-height: 1.35;
    color: #FDFBF7;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  body.sleptday .sl-cap.show { opacity: 1; transform: translateY(0); }

  body.sleptday .sl-skip {
    position: absolute;
    bottom: 1.6rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.62rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(253, 251, 247, 0.5);
  }

  /* ---------- the bedroom, inside the love note ---------- */
  body.sleptday .sl {
    position: relative;
    z-index: 10;
    margin-top: 1.3rem;
    --bri: 1;
    --pg: 0.6;
  }
  body.sleptday .sl[data-drowse="1"] { --bri: 0.93; --pg: 0.48; }
  body.sleptday .sl[data-drowse="2"] { --bri: 0.85; --pg: 0.34; }
  body.sleptday .sl[data-drowse="3"] { --bri: 0.77; --pg: 0.22; }
  body.sleptday .sl[data-drowse="4"] { --bri: 0.7;  --pg: 0.1; }
  body.sleptday .sl[data-drowse="5"] { --bri: 0.62; --pg: 0; }

  body.sleptday .sl-scene {
    position: relative;
    width: min(252px, 68vw);
    aspect-ratio: 252 / 184;
    margin: 0 auto;
    border-radius: 14px;
    overflow: hidden;
    background: linear-gradient(180deg, #221A2B 0%, #3A2C3E 62%, #4A3844 100%);
    border: 1px solid var(--border);
    box-shadow: 0 10px 24px rgba(62, 44, 35, 0.2);
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1.25);
  }
  body.sleptday .sl.go .sl-scene { opacity: 1; transform: scale(1); }

  body.sleptday .sl-stars { position: absolute; inset: 0; }
  body.sleptday .sl-stars i {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #FDFBF7;
    animation: sl-twinkle 2.6s ease-in-out infinite;
  }
  @keyframes sl-twinkle { 50% { opacity: 0.2; } }

  body.sleptday .sl-moon {
    position: absolute;
    right: 9%;
    top: 8%;
    width: 11%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    box-shadow: inset 7px -3px 0 0 #F6DFA8;
    filter: drop-shadow(0 0 5px rgba(246, 223, 168, 0.35));
    transition: filter 0.8s ease;
  }
  body.sleptday .sl.asleep .sl-moon { filter: drop-shadow(0 0 14px rgba(246, 223, 168, 0.9)); }

  body.sleptday .sl-clock {
    position: absolute;
    right: 7%;
    top: 29%;
    font-size: 0.6rem;
    letter-spacing: 0.06em;
    color: rgba(243, 215, 218, 0.85);
    font-variant-numeric: tabular-nums;
  }
  body.sleptday .sl-clock b { font-size: 0.8rem; font-weight: 600; }

  /* the thought bubble the sheep jump through */
  body.sleptday .sl-bubble {
    position: absolute;
    left: 3%;
    top: 5%;
    width: 46%;
    height: 28%;
    border-radius: 999px;
    overflow: hidden;
    background: rgba(253, 251, 247, 0.1);
    border: 1px dashed rgba(253, 251, 247, 0.35);
  }
  body.sleptday .sl-fence {
    position: absolute;
    left: 50%;
    bottom: 8%;
    width: 22%;
    margin-left: -11%;
  }
  body.sleptday .sl-fence svg { display: block; width: 100%; }

  body.sleptday .sl-sheep {
    position: absolute;
    bottom: 10%;
    left: -30%;
    width: 30%;
    animation: sl-run 1.4s linear forwards;
  }
  @keyframes sl-run { to { left: 105%; } }
  body.sleptday .sl-hop { animation: sl-hop 1.4s ease-in-out forwards; }
  @keyframes sl-hop {
    0%, 34%   { transform: translateY(0) rotate(0deg); }
    50%       { transform: translateY(-62%) rotate(-8deg); }
    66%, 100% { transform: translateY(0) rotate(0deg); }
  }
  body.sleptday .sl-sheep svg { display: block; width: 100%; }

  /* the bed */
  body.sleptday .sl-pillow {
    position: absolute;
    left: 50%;
    bottom: 16%;
    width: 62%;
    height: 36%;
    margin-left: -31%;
    border-radius: 50%;
    background: linear-gradient(180deg, #FDFBF7 0%, #EDE3D6 100%);
    opacity: 0.95;
  }
  body.sleptday .sl-face {
    position: absolute;
    left: 50%;
    bottom: 20%;
    width: 34%;
    aspect-ratio: 1 / 1;
    margin-left: -17%;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid #FDFBF7;
    z-index: 2;
    box-shadow: 0 0 22px 5px rgba(150, 180, 255, var(--pg));
    transition: box-shadow 0.7s ease;
  }
  body.sleptday .sl-face img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 55% 55%;
    filter: brightness(var(--bri));
    transition: filter 0.7s ease;
  }

  body.sleptday .sl-phone {
    position: absolute;
    left: 66%;
    bottom: 24%;
    width: 8%;
    height: 17%;
    z-index: 3;
    border-radius: 4px;
    border: 2px solid #2B2233;
    background: linear-gradient(160deg, #DCE7FF 0%, #9FB8F0 100%);
    box-shadow: 0 0 12px 3px rgba(160, 190, 255, var(--pg));
    transform: rotate(-12deg);
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.6, 1), opacity 0.6s ease, box-shadow 0.7s ease;
  }
  body.sleptday .sl-phone.nope { animation: sl-nope 0.45s ease; }
  @keyframes sl-nope {
    0%, 100% { transform: rotate(-12deg); }
    30%      { transform: rotate(-26deg) translateX(-2px); }
    60%      { transform: rotate(2deg) translateX(2px); }
  }
  body.sleptday .sl.asleep .sl-phone { transform: translate(10px, 70px) rotate(50deg); opacity: 0; }

  body.sleptday .sl-blanket {
    position: absolute;
    left: 4%;
    right: 4%;
    bottom: -4%;
    height: 36%;
    z-index: 4;
    border-radius: 20px 20px 0 0;
    border-top: 2px dashed rgba(253, 251, 247, 0.5);
    background:
      repeating-linear-gradient(90deg, transparent 0 16px, rgba(255, 255, 255, 0.16) 16px 17px),
      repeating-linear-gradient(0deg, transparent 0 16px, rgba(255, 255, 255, 0.16) 16px 17px),
      linear-gradient(180deg, #D9A0A5 0%, #C88A90 100%);
    box-shadow: 0 -3px 8px rgba(0, 0, 0, 0.25);
    transform: translateY(14%);
    transition: transform 0.9s cubic-bezier(0.3, 0.8, 0.3, 1);
  }
  body.sleptday .sl.asleep .sl-blanket { transform: translateY(-12%); }

  body.sleptday .sl-z {
    position: absolute;
    left: 63%;
    top: 30%;
    z-index: 5;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: #F3D7DA;
    pointer-events: none;
    animation: sl-z 2.4s ease-out forwards;
  }
  @keyframes sl-z {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.6); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translate(26px, -46px) scale(1.3); }
  }

  /* labels + controls, same family as the other days */
  body.sleptday .sl-labels { text-align: center; margin-top: 0.9rem; min-height: 2.6rem; }
  body.sleptday .sl-name {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--espresso);
  }
  body.sleptday .sl-line {
    display: block;
    font-family: 'Great Vibes', cursive;
    font-size: 1.15rem;
    color: var(--rose);
    margin-top: 0.05rem;
    min-height: 1.3rem;
  }
  body.sleptday .sl-actions {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 0.9rem;
  }
  body.sleptday .sl-btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.45rem 1.05rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--key);
    color: var(--mocha);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.06s ease;
  }
  body.sleptday .sl-btn:active { transform: scale(0.95); }
  body.sleptday .sl-btn.main { background: #4A3844; border-color: #4A3844; color: #F3D7DA; }

  body.sleptday .sl-hint {
    text-align: center;
    font-size: 0.72rem;
    color: var(--taupe);
    margin-top: 0.65rem;
    animation: sl-pulse 2.4s ease-in-out infinite;
  }
  body.sleptday .sl-hint.gone { display: none; }
  @keyframes sl-pulse { 50% { opacity: 0.45; } }

  body.sleptday .sl-count {
    text-align: center;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--mocha);
    margin-top: 0.7rem;
    min-height: 1rem;
  }
  body.sleptday .sl-count.pop { animation: sl-pop 0.3s ease; }
  @keyframes sl-pop { 50% { transform: scale(1.13); } }

  body.sleptday .sl-fx {
    position: fixed;
    z-index: 70;
    pointer-events: none;
    font-family: 'Great Vibes', cursive;
    font-size: 1.5rem;
    color: var(--rose);
    text-shadow: 0 1px 3px rgba(253, 251, 247, 0.9);
    animation: sl-float 1s ease-out forwards;
  }
  @keyframes sl-float {
    0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
    25%  { transform: translate(-50%, -85%) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -180%) scale(1);  opacity: 0; }
  }

  @media (max-height: 780px) {
    body.sleptday .sl { margin-top: 0.9rem; }
    body.sleptday .sl-scene { width: min(214px, 60vw); }
  }

  @media (prefers-reduced-motion: reduce) {
    body.sleptday .sl-scene { opacity: 1 !important; transform: none !important; transition: none; }
    body.sleptday .sl-stars i,
    body.sleptday .sl-hint,
    body.sleptday .sl-fx,
    body.sleptday .sl-phone.nope { animation: none !important; }
  }
</style>

<script>
(function () {
  "use strict";

  /* ── change this one line to move the whole thing to another date ── */
  const SLEPT_DAY = "09-30";

  /* photo, relative to index.html */
  const DIR = "toast/";
  const FACE = "amy-4.png";

  let dk;
  try { dk = dateKey; } catch (e) { return; }
  if (dk !== SLEPT_DAY) return;

  const card = document.getElementById("modal-card");
  const sig = card && card.querySelector(".signature");
  const backdropEl = document.getElementById("modal-backdrop");
  const titleEl = document.getElementById("modal-title");
  if (!card || !sig || !backdropEl) return;

  document.body.classList.add("sleptday");

  const sub = document.querySelector("header p");
  if (sub) sub.textContent = "it's past your bedtime :)";

  const softMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* if the photo is missing, this stands in so nothing breaks */
  const PLACEHOLDER =
    "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<rect width="100" height="100" fill="#F3E8D2"/>' +
      '<path d="M32 44 Q38 48 44 44" stroke="#6B5142" stroke-width="3.5" fill="none" stroke-linecap="round"/>' +
      '<path d="M56 44 Q62 48 68 44" stroke="#6B5142" stroke-width="3.5" fill="none" stroke-linecap="round"/>' +
      '<path d="M40 64 Q50 70 60 64" stroke="#6B5142" stroke-width="3.5" fill="none" stroke-linecap="round"/>' +
      "</svg>");

  let SRC = DIR + FACE;
  const probe = new Image();
  probe.onerror = function () {
    SRC = PLACEHOLDER;
    document.querySelectorAll(".sl-face img, .sl-glow img").forEach(function (im) { im.src = SRC; });
  };
  probe.src = SRC;

  const SHEEP =
    '<svg viewBox="0 0 40 28" aria-hidden="true">' +
      '<g fill="#3E2C23">' +
        '<rect x="12" y="19" width="2.4" height="8" rx="1"/><rect x="17" y="20" width="2.4" height="7" rx="1"/>' +
        '<rect x="25" y="20" width="2.4" height="7" rx="1"/><rect x="30" y="19" width="2.4" height="8" rx="1"/>' +
      "</g>" +
      '<g fill="#FFFFFF" stroke="#E4DCD1" stroke-width="0.8">' +
        '<circle cx="13" cy="14" r="7"/><circle cx="20" cy="10.5" r="7.5"/><circle cx="27" cy="13" r="7"/>' +
        '<circle cx="19.5" cy="17" r="7"/><circle cx="26" cy="18" r="5.5"/>' +
      "</g>" +
      '<ellipse cx="34" cy="12" rx="5" ry="4.3" fill="#3E2C23"/>' +
      '<ellipse cx="31.5" cy="8.6" rx="2.2" ry="1.2" fill="#3E2C23" transform="rotate(-25 31.5 8.6)"/>' +
      '<circle cx="35.6" cy="11" r="0.9" fill="#FDFBF7"/>' +
    "</svg>";

  const FENCE =
    '<svg viewBox="0 0 40 22" aria-hidden="true"><g fill="#C7BCB1">' +
      '<rect x="4" y="2" width="4" height="20" rx="1"/><rect x="18" y="2" width="4" height="20" rx="1"/>' +
      '<rect x="32" y="2" width="4" height="20" rx="1"/>' +
      '<rect x="0" y="6" width="40" height="3" rx="1"/><rect x="0" y="14" width="40" height="3" rx="1"/>' +
    "</g></svg>";

  /* ═════════ 1. the bedroom ═════════ */

  const plate = document.createElement("div");
  plate.className = "sl";
  plate.setAttribute("data-drowse", "0");
  plate.innerHTML =
    '<div class="sl-scene">' +
      '<div class="sl-stars"></div>' +
      '<div class="sl-moon"></div>' +
      '<div class="sl-clock"><b>3:07</b> am</div>' +
      '<div class="sl-bubble"><div class="sl-fence">' + FENCE + "</div></div>" +
      '<div class="sl-pillow"></div>' +
      '<div class="sl-face"><img src="' + SRC + '" alt="someone who should be asleep" draggable="false"></div>' +
      '<div class="sl-phone"></div>' +
      '<div class="sl-blanket"></div>' +
    "</div>" +
    '<div class="sl-labels"><span class="sl-name"></span><span class="sl-line"></span></div>' +
    '<div class="sl-actions">' +
      '<button class="sl-btn main" type="button">count a sheep</button>' +
      '<button class="sl-btn phone" type="button">take her phone</button>' +
    "</div>" +
    '<p class="sl-hint">(she won\'t go to sleep on her own)</p>' +
    '<p class="sl-count" role="status"></p>';
  card.insertBefore(plate, sig);

  const scene = plate.querySelector(".sl-scene");
  const bubble = plate.querySelector(".sl-bubble");
  const clockEl = plate.querySelector(".sl-clock b");
  const phoneEl = plate.querySelector(".sl-phone");
  const nameEl = plate.querySelector(".sl-name");
  const lineEl = plate.querySelector(".sl-line");
  const sheepBtn = plate.querySelector(".sl-btn.main");
  const phoneBtn = plate.querySelector(".sl-btn.phone");
  const hint = plate.querySelector(".sl-hint");
  const countEl = plate.querySelector(".sl-count");

  const starBox = plate.querySelector(".sl-stars");
  for (let i = 0; i < 12; i++) {
    const s = document.createElement("i");
    s.style.left = (Math.random() * 96 + 2) + "%";
    s.style.top = (Math.random() * 46 + 2) + "%";
    s.style.animationDelay = -(Math.random() * 2.6) + "s";
    if (Math.random() < 0.3) { s.style.width = "3px"; s.style.height = "3px"; }
    starBox.appendChild(s);
  }

  const STATES = [
    { name: "wide awake.",      line: "it's 3am wu" },
    { name: "still scrolling.", line: "one sheep. she didn't notice" },
    { name: "yawning.",         line: "it's working" },
    { name: "eyes closing.",    line: "ok NOW take the phone" },
    { name: "almost…",          line: "shhh" },
    { name: "asleep.",          line: "finally. goodnight wu :)" }
  ];

  const EXCUSES = ["5 more minutes", "one more video", "i'm not even tired", "no :)", "wait i'm texting you"];

  const MILESTONES = {
    1: "sheep counted: 1",
    5: "sheep counted: 5 · she's still up isn't she",
    10: "sheep counted: 10. i've run out of sheep names",
    25: "sheep counted: 25. the sheep are tired now too",
    50: "sheep counted: 50. wu. bed.",
    100: "sheep counted: 100. ok you're doing this on purpose"
  };

  let sheep = 0;
  try { sheep = parseInt(localStorage.getItem("amy-sheep") || "0", 10) || 0; } catch (e) {}
  function renderCount() { countEl.textContent = MILESTONES[sheep] || "sheep counted: " + sheep; }
  if (sheep > 0) { renderCount(); hint.classList.add("gone"); }

  function fx(text, el) {
    if (softMotion) return;
    const r = el.getBoundingClientRect();
    const d = document.createElement("div");
    d.className = "sl-fx";
    d.textContent = text;
    d.style.left = (r.left + r.width / 2 + (Math.random() * 26 - 13)) + "px";
    d.style.top = (r.top + 20) + "px";
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 1050);
  }

  let stage = null, timers = [];
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  /* ═════════ 2. getting her to sleep ═════════ */

  let drowse = 0, asleep = false, minutes = 187, session = 0, sheepBusy = false, excuse = 0, zTimer = null;

  function fmt(min) {
    const h = Math.floor(min / 60) % 12 || 12;
    return h + ":" + String(min % 60).padStart(2, "0");
  }
  function setClock() { clockEl.textContent = fmt(minutes); }

  function paint() {
    plate.setAttribute("data-drowse", String(drowse));
    nameEl.textContent = STATES[drowse].name;
    lineEl.textContent = STATES[drowse].line;
  }

  function spawnZ() {
    const z = document.createElement("span");
    z.className = "sl-z";
    z.textContent = Math.random() < 0.5 ? "z" : "Z";
    z.style.fontSize = (0.8 + Math.random() * 0.5) + "rem";
    scene.appendChild(z);
    setTimeout(function () { z.remove(); }, 2500);
  }
  function zLoop() {
    if (!asleep) return;
    if (!softMotion) spawnZ();
    zTimer = setTimeout(zLoop, 1100);
  }
  function stopZ() { clearTimeout(zTimer); zTimer = null; }

  function fallAsleep() {
    if (asleep) return;
    asleep = true;
    drowse = 5;
    paint();
    plate.classList.add("asleep");
    later(function () { fx("goodnight :)", scene); }, 500);
    zLoop();
  }

  function countSheep() {
    if (sheepBusy) return;
    sheepBusy = true;
    hint.classList.add("gone");

    if (!softMotion) {
      const s = document.createElement("div");
      s.className = "sl-sheep";
      s.innerHTML = '<div class="sl-hop">' + SHEEP + "</div>";
      bubble.appendChild(s);
      setTimeout(function () { s.remove(); }, 1500);
    }

    later(function () {
      session++;
      sheep++;
      try { localStorage.setItem("amy-sheep", String(sheep)); } catch (e) {}
      renderCount();
      countEl.classList.remove("pop");
      void countEl.offsetWidth;
      countEl.classList.add("pop");

      minutes += 4;                                /* sheep take time */
      setClock();
      fx(String(session), bubble);

      if (!asleep) {
        if (drowse + 1 >= 5) fallAsleep();
        else { drowse++; paint(); }
      }
      sheepBusy = false;
    }, softMotion ? 150 : 900);
  }

  function takePhone() {
    hint.classList.add("gone");
    if (asleep) { fx("already got it :)", phoneBtn); return; }
    if (drowse < 3) {                              /* she's not tired enough to let go */
      fx(EXCUSES[excuse++ % EXCUSES.length], phoneEl);
      phoneEl.classList.remove("nope");
      void phoneEl.offsetWidth;
      phoneEl.classList.add("nope");
      return;
    }
    fx("got it.", phoneEl);
    fallAsleep();
  }

  sheepBtn.addEventListener("click", countSheep);
  phoneBtn.addEventListener("click", takePhone);

  function reset() {
    stopZ();
    asleep = false; drowse = 0; minutes = 187; session = 0; sheepBusy = false; excuse = 0;
    plate.classList.remove("asleep");
    scene.querySelectorAll(".sl-z, .sl-sheep").forEach(function (n) { n.remove(); });
    setClock();
    paint();
  }
  reset();

  /* ═════════ 3. the intro: 3am ═════════ */

  function teardown() {
    clearTimers();
    if (stage) { stage.remove(); stage = null; }
  }

  function reveal() {
    teardown();
    plate.classList.add("go");
    later(function () {
      if (!backdropEl.classList.contains("show")) return;
      const cardRect = card.getBoundingClientRect();
      const plateRect = plate.getBoundingClientRect();
      if (plateRect.bottom > cardRect.bottom - 10) {
        card.scrollTo({ top: Math.max(0, plate.offsetTop - 30), behavior: "smooth" });
      }
    }, 620);
  }

  function runIntro() {
    teardown();
    if (softMotion) { reveal(); return; }

    stage = document.createElement("div");
    stage.className = "sl-stage";
    stage.innerHTML =
      '<div class="sl-bigclock"><span>2:58</span><small>am</small></div>' +
      '<div class="sl-glow"><img src="' + SRC + '" alt="" draggable="false"></div>' +
      '<p class="sl-cap"></p>' +
      '<p class="sl-skip">tap to skip</p>';
    document.body.appendChild(stage);

    const clk = stage.querySelector(".sl-bigclock span");
    const glow = stage.querySelector(".sl-glow");
    const cap = stage.querySelector(".sl-cap");
    function say(text) {
      cap.classList.remove("show");
      later(function () { cap.textContent = text; cap.classList.add("show"); }, 220);
    }

    for (let i = 1; i <= 9; i++) {
      (function (n) { later(function () { clk.textContent = fmt(178 + n); }, 300 + n * 110); })(i);
    }
    later(function () { say("it's 3am."); }, 1400);
    later(function () { glow.classList.add("show"); say("and someone's still on her phone."); }, 2600);
    later(function () { say("go to sleep wu."); }, 4300);
    later(function () { if (stage) stage.classList.add("clearing"); }, 5500);
    later(reveal, 5950);

    stage.addEventListener("click", reveal);
  }

  /* ═════════ 4. fire it when the note opens ═════════ */

  new MutationObserver(function () {
    if (backdropEl.classList.contains("show")) {
      if (titleEl) titleEl.textContent = "Bedtime.";
      reset();
      runIntro();
    } else {
      teardown();
      stopZ();
      sheepBusy = false;
      plate.classList.remove("go");                /* so it replays next time she opens the note */
    }
  }).observe(backdropEl, { attributes: true, attributeFilter: ["class"] });
})();

    const f = document.createElement("i");
    f.style.left = (50 + 52 * Math.cos(rad)) + "%";
    f.style.top = (50 + 52 * Math.sin(rad)) + "%";
    f.style.setProperty("--r", (a + 90) + "deg");
    f.style.animationDelay = -(Math.random() * 0.5) + "s";
    flameBox.appendChild(f);
  }

  const LEVELS = [
    { name: "mild.",         line: "she's fine. for now." },
    { name: "a little kick", line: "barely a tingle" },
    { name: "medium",        line: "ok she felt that one" },
    { name: "hot",           line: "the nose scrunch has begun" },
    { name: "very hot",      line: "wu is sweating" },
    { name: "WU.",           line: "drink some milk. please." }
  ];
  const CHOMPS = [null, "chomp", "*crunch*", "oh.", "OH.", "WUUUUU"];
  const GULPS = ["gulp", "ahh", "*milk mustache*", "better?"];

  const MILESTONES = {
    1: "chilis eaten: 1",
    5: "chilis eaten: 5 · respect",
    10: "chilis eaten: 10. are you ok",
    25: "chilis eaten: 25. this is a cry for help",
    50: "chilis eaten: 50. drink. the. milk.",
    100: "chilis eaten: 100. WUUUUUUU"
  };

  let eaten = 0;
  try { eaten = parseInt(localStorage.getItem("amy-chilis") || "0", 10) || 0; } catch (e) {}
  function renderCount() { countEl.textContent = MILESTONES[eaten] || "chilis eaten: " + eaten; }
  if (eaten > 0) { renderCount(); hint.classList.add("gone"); }

  function fx(text, el) {
    if (softMotion) return;
    const r = el.getBoundingClientRect();
    const d = document.createElement("div");
    d.className = "sp-fx";
    d.textContent = text;
    d.style.left = (r.left + r.width / 2 + (Math.random() * 26 - 13)) + "px";
    d.style.top = (r.top + 20) + "px";
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 1050);
  }

  function sparkle(x, y, colors) {
    if (softMotion) return;
    for (let i = 0; i < 14; i++) {
      const p = document.createElement("div");
      p.className = "burst";                     /* reuses the petal-burst CSS */
      const s = 6 + Math.random() * 8;
      p.style.width = s + "px";
      p.style.height = s * 0.75 + "px";
      p.style.left = x + "px";
      p.style.top = y + "px";
      p.style.background = colors[i % colors.length];
      const a = Math.random() * Math.PI * 2;
      const d = 34 + Math.random() * 70;
      p.style.setProperty("--tx", Math.cos(a) * d + "px");
      p.style.setProperty("--ty", (Math.sin(a) * d - 30) + "px");
      p.style.setProperty("--rot", (Math.random() * 400 - 200) + "deg");
      document.body.appendChild(p);
      setTimeout(function () { p.remove(); }, 1300);
    }
  }
  const FIRE = ["#D9423B", "#E8643A", "#F6B45A", "#FFE9A3"];
  const MILK = ["#FFFFFF", "#FDFBF7", "#F3E8D2", "var(--blushpk)"];

  let stage = null, timers = [];
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  /* ═════════ 2. the spice ═════════ */

  let lv = 0, busy = false, gulps = 0;

  function setLv(n) {
    lv = n;
    plate.setAttribute("data-lv", String(n));
    plate.classList.toggle("sweaty", n >= 2);
    plate.classList.toggle("hot", n >= 3);
    plate.classList.toggle("max", n >= 5);
    pipEls.forEach(function (p, i) { p.classList.toggle("on", i < n); });
    nameEl.textContent = LEVELS[n].name;
    lineEl.textContent = LEVELS[n].line;
  }
  setLv(0);

  function addChili() {
    if (busy) return;
    hint.classList.add("gone");
    if (lv >= 5) { fx("no more. milk.", chiliBtn); return; }
    busy = true;

    if (!softMotion) {
      const c = document.createElement("div");
      c.className = "sp-fall";
      c.innerHTML = CHILI("#D9423B");
      wrap.appendChild(c);
      setTimeout(function () { c.remove(); }, 800);
    }

    later(function () {
      setLv(lv + 1);
      eaten++;
      try { localStorage.setItem("amy-chilis", String(eaten)); } catch (e) {}
      renderCount();
      countEl.classList.remove("pop");
      void countEl.offsetWidth;
      countEl.classList.add("pop");

      frame.classList.remove("chomp");
      void frame.offsetWidth;
      frame.classList.add("chomp");

      fx(CHOMPS[lv], frame);
      const r = frame.getBoundingClientRect();
      sparkle(r.left + r.width / 2, r.top + r.height * 0.78, FIRE);
      busy = false;
    }, softMotion ? 100 : 700);
  }

  function drinkMilk() {
    hint.classList.add("gone");
    if (lv === 0) { fx("she's not even warm yet", milkBtn); return; }
    fx(GULPS[gulps++ % GULPS.length], frame);
    const r = frame.getBoundingClientRect();
    sparkle(r.left + r.width / 2, r.top + r.height / 2, MILK);
    setLv(0);
  }

  chiliBtn.addEventListener("click", addChili);
  milkBtn.addEventListener("click", drinkMilk);

  /* ═════════ 3. the intro: pumpkin spice or just spicy? ═════════ */

  function teardown() {
    clearTimers();
    if (stage) { stage.remove(); stage = null; }
  }

  function reveal() {
    teardown();
    plate.classList.add("go");
    later(function () {
      if (!backdropEl.classList.contains("show")) return;
      const cardRect = card.getBoundingClientRect();
      const plateRect = plate.getBoundingClientRect();
      if (plateRect.bottom > cardRect.bottom - 10) {
        card.scrollTo({ top: Math.max(0, plate.offsetTop - 20), behavior: "smooth" });
      }
    }, 620);
  }

  function runIntro() {
    teardown();
    if (softMotion) { reveal(); return; }

    stage = document.createElement("div");
    stage.className = "sp-stage";
    stage.innerHTML =
      '<div class="sp-duo">' +
        '<div class="sp-item cup">' + CUP + "</div>" +
        '<div class="sp-item pep">' + CHILI("#D9423B") + "</div>" +
        '<div class="sp-bigface"><img src="' + SRC + '" alt="" draggable="false"><div class="sp-heat"></div></div>' +
      "</div>" +
      '<p class="sp-cap"></p>' +
      '<p class="sp-skip">tap to skip</p>';
    document.body.appendChild(stage);

    const cup = stage.querySelector(".sp-item.cup");
    const pep = stage.querySelector(".sp-item.pep");
    const face = stage.querySelector(".sp-bigface");
    const cap = stage.querySelector(".sp-cap");
    function say(text) {
      cap.classList.remove("show");
      later(function () { cap.textContent = text; cap.classList.add("show"); }, 220);
    }

    later(function () { cup.classList.add("in"); say("pumpkin spice?"); }, 300);
    later(function () { pep.classList.add("in"); say("or just spicy?"); }, 1500);
    later(function () { cup.classList.add("merge"); pep.classList.add("merge"); }, 2800);
    later(function () {
      face.classList.add("show");
      say("both. obviously.");
      const r = face.getBoundingClientRect();
      sparkle(r.left + r.width / 2, r.top + r.height / 2, FIRE);
    }, 3150);
    later(function () { if (stage) stage.classList.add("clearing"); }, 4700);
    later(reveal, 5150);

    stage.addEventListener("click", reveal);
  }

  /* ═════════ 4. fire it when the note opens ═════════ */

  new MutationObserver(function () {
    if (backdropEl.classList.contains("show")) {
      if (titleEl) titleEl.textContent = "Too hot.";
      busy = false;
      gulps = 0;
      wrap.querySelectorAll(".sp-fall").forEach(function (n) { n.remove(); });
      setLv(0);
      runIntro();
    } else {
      teardown();
      busy = false;
      plate.classList.remove("go");                /* so it replays next time she opens the note */
    }
  }).observe(backdropEl, { attributes: true, attributeFilter: ["class"] });
})();
</script>
