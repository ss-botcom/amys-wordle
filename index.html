<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Amy's Daily Wordle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Great+Vibes&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Amy's Wordle" />
<meta name="theme-color" content="#FDFBF7" />
<style>
  :root {
    --latte:    #FDFBF7;  /* warm latte cream background     */
    --espresso: #3E2C23;  /* rich espresso brown             */
    --mocha:    #6B5142;  /* softer brown for secondary text */
    --lily:     #FFFFFF;  /* lily white                      */
    --sage:     #A8BBA0;  /* soft sage green  = correct      */
    --butter:   #E3C481;  /* warm buttery gold = present     */
    --taupe:    #C7BCB1;  /* muted taupe gray = absent       */
    --rose:     #D9A0A5;  /* gentle rose-pink accent         */
    --blushpk:  #F3D7DA;  /* pale petal pink                 */
    --border:   #E4DCD1;  /* light coffee-cream border       */
    --key:      #F1EAE0;  /* keyboard key resting color      */
    /* deeper versions for tiles + keys, so white letters stay readable (~3:1) */
    --sage-d:   #7E9A72;
    --butter-d: #B78A29;
    --taupe-d:  #A28F7D;
    --tile-border: #DDD2C4;
    --header-bg: rgba(253, 251, 247, 0.92);
  }

  /* ---------- Reset (the same baseline the old Tailwind CDN script gave us) ---------- */
  *, ::before, ::after { box-sizing: border-box; border: 0 solid var(--border); }
  html { line-height: 1.5; -webkit-text-size-adjust: 100%; }
  body { margin: 0; line-height: inherit; }
  h1, h2, h3, p { margin: 0; font-size: inherit; font-weight: inherit; }
  button { font: inherit; color: inherit; margin: 0; padding: 0; background: transparent; cursor: pointer; }
  img, svg, video, canvas { display: block; vertical-align: middle; }
  img, video { max-width: 100%; height: auto; }

  html, body {
    background: var(--latte);
    color: var(--espresso);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  body { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Layout ---------- */
  .site-header {
    width: 100%;
    position: relative;
    z-index: 10;
    border-bottom: 1px solid var(--border);
    background: var(--header-bg);
    transition: background 0.6s ease;
  }
  .header-inner {
    max-width: 32rem;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.875rem;
    padding: 1rem;
  }
  .header-text { text-align: center; }
  .site-title {
    font-size: 1.5rem;
    line-height: 2rem;
    font-weight: 600;
    letter-spacing: 0.025em;
    color: var(--espresso);
  }
  @media (min-width: 640px) { .site-title { font-size: 1.875rem; line-height: 2.25rem; } }
  .subtitle {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    margin-top: 0.125rem;
    color: var(--rose);
    text-wrap: balance;          /* no lonely "YOU" on its own line */
  }
  #today-line { font-size: 0.7rem; margin-top: 0.25rem; font-weight: 500; color: var(--mocha); }

  main.game {
    flex: 1;
    width: 100%;
    max-width: 32rem;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 0.75rem;
    position: relative;
    z-index: 10;
  }
  #board {
    display: grid;
    grid-template-rows: repeat(6, minmax(0, 1fr));
    gap: 0.375rem;
    width: 100%;
    max-width: 21rem;
  }
  .row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.375rem; }
  #keyboard {
    width: 100%;
    max-width: 32rem;
    display: flex;
    flex-direction: column;
    gap: 0.375rem;
    padding-bottom: 0.5rem;
  }
  .key-row { display: flex; gap: 0.375rem; width: 100%; justify-content: center; }

  .font-display { font-family: 'Playfair Display', serif; }
  .font-script  { font-family: 'Great Vibes', cursive; }

  /* ---------- Page-load reveal ---------- */
  .rise { animation: rise 0.7s ease both; }
  .rise-1 { animation-delay: 0.05s; }
  .rise-2 { animation-delay: 0.18s; }
  .rise-3 { animation-delay: 0.32s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Coffee steam ---------- */
  .steam path {
    opacity: 0;
    animation: steam-rise 2.8s ease-in-out infinite;
  }
  .steam path:nth-child(2) { animation-delay: 0.7s; }
  .steam path:nth-child(3) { animation-delay: 1.4s; }
  @keyframes steam-rise {
    0%   { opacity: 0;   transform: translateY(2px); }
    35%  { opacity: 0.8; }
    100% { opacity: 0;   transform: translateY(-4px); }
  }

  /* ---------- Lily sway ---------- */
  .lily-icon {
    animation: sway 5.5s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-4deg); }
    50%      { transform: rotate(4deg); }
  }

  /* ---------- Drifting lily petals (ambient background) ---------- */
  .petal {
    position: fixed;
    top: -4rem;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 30% 30%, var(--lily) 0%, var(--blushpk) 75%);
    border-radius: 65% 35% 60% 40% / 55% 45% 65% 35%;
    box-shadow: 0 1px 3px rgba(217, 160, 165, 0.15);
    animation: petal-fall linear infinite;
  }
  @keyframes petal-fall {
    0%   { transform: translateY(-6vh)  translateX(0)       rotate(0deg); }
    25%  { transform: translateY(26vh)  translateX(2.4rem)  rotate(75deg); }
    50%  { transform: translateY(52vh)  translateX(-1.6rem) rotate(160deg); }
    75%  { transform: translateY(78vh)  translateX(2rem)    rotate(235deg); }
    100% { transform: translateY(110vh) translateX(-1rem)   rotate(330deg); }
  }

  /* ---------- Victory petal burst ---------- */
  .burst {
    position: fixed;
    z-index: 45;
    pointer-events: none;
    border-radius: 65% 35% 60% 40% / 55% 45% 65% 35%;
    animation: burst 1.2s cubic-bezier(0.16, 0.6, 0.4, 1) forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0, 0) rotate(0deg) scale(0.6); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1); opacity: 0; }
  }

  /* ---------- Tiles ---------- */
  .tile {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.4rem, 6vw, 2rem);
    font-weight: 700;
    text-transform: uppercase;
    border: 2px solid var(--tile-border);
    border-radius: 0.5rem;
    background: var(--lily);
    color: var(--espresso);
    user-select: none;
    box-shadow: 0 1px 2px rgba(62, 44, 35, 0.04);
    transition: transform 0.1s ease, border-color 0.15s ease;
  }
  .tile.filled {
    border-color: var(--mocha);
    animation: pop 0.12s ease;
  }
  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* a real card flip: tips away, goes edge-on (color swaps there), lands face up */
  .row { perspective: 520px; }
  .tile.flip { animation: flip 0.6s cubic-bezier(0.45, 0.05, 0.4, 1) forwards; }
  @keyframes flip {
    0%     { transform: rotateX(0deg); box-shadow: 0 1px 2px rgba(62, 44, 35, 0.04); }
    49.9%  { transform: rotateX(-90deg) translateY(-3px); box-shadow: 0 10px 14px rgba(62, 44, 35, 0.16); }
    50%    { transform: rotateX(90deg) translateY(-3px); }
    100%   { transform: rotateX(0deg); box-shadow: 0 1px 2px rgba(62, 44, 35, 0.04); }
  }
  .tile.correct { background: var(--sage-d);   border-color: var(--sage-d);   color: #FFFFFF; }
  .tile.present { background: var(--butter-d); border-color: var(--butter-d); color: #FFFFFF; }
  .tile.absent  { background: var(--taupe-d);  border-color: var(--taupe-d);  color: #FFFFFF; }

  .row.shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .tile.dance { animation: dance 0.5s ease; }
  @keyframes dance {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  /* 1–2 guesses: bigger, springier hop with a spin */
  .tile.dance-big { animation: dance-big 0.8s cubic-bezier(0.3, 1.6, 0.5, 1); }
  @keyframes dance-big {
    0%   { transform: translateY(0) rotate(0); }
    35%  { transform: translateY(-26px) rotate(-8deg) scale(1.08); }
    60%  { transform: translateY(0) rotate(4deg) scale(0.96, 1.04); }
    80%  { transform: translateY(-6px) rotate(0); }
    100% { transform: translateY(0); }
  }
  /* 6 guesses: phew — a slow relieved sink and recover */
  .tile.phew { animation: phew 1.1s ease-in-out; }
  @keyframes phew {
    0%, 100% { transform: translateY(0) scale(1); }
    40%      { transform: translateY(5px) scale(1.03, 0.94); }
    70%      { transform: translateY(-4px) scale(0.99, 1.02); }
  }
  /* out of guesses: everything droops a little */
  .tile.droop { animation: droop 0.9s cubic-bezier(0.5, 0, 0.6, 1.4) forwards; }
  @keyframes droop {
    to { transform: translateY(3px) rotate(var(--droop, 2deg)); filter: saturate(0.6); }
  }
  .row:nth-child(odd) .tile.droop { --droop: -2deg; }

  /* ---------- Keyboard ---------- */
  .key {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: clamp(0.8rem, 3.2vw, 0.95rem);
    text-transform: uppercase;
    background: var(--key);
    color: var(--espresso);
    border-radius: 0.45rem;
    height: 3.4rem;
    box-shadow: 0 2px 0 rgba(62, 44, 35, 0.13);
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    transition: background 0.15s ease, color 0.15s ease, transform 0.05s ease;
    user-select: none;
  }
  .key:active { transform: translateY(2px) scale(0.96); box-shadow: 0 0 0 rgba(62, 44, 35, 0.13); }
  .key.wide { flex: 1.6; font-size: 0.72rem; letter-spacing: 0.03em; }
  .key.correct { background: var(--sage-d);   color: #fff; }
  .key.present { background: var(--butter-d); color: #fff; }
  .key.absent  { background: var(--taupe-d);  color: #fff; }
  /* keys that just changed color pop, left to right */
  .key.key-pop { animation: key-pop 0.42s cubic-bezier(0.3, 1.6, 0.5, 1) backwards; }
  @keyframes key-pop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.16) translateY(-3px); }
    100% { transform: scale(1); }
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    top: 6.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--espresso);
    color: var(--latte);
    padding: 0.6rem 1.2rem;
    border-radius: 0.5rem;
    font-size: 0.9rem;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 60;
  }
  #toast.show { opacity: 1; }

  /* ---------- Modal (love-note card) ---------- */
  #modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(62, 44, 35, 0.45);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 50;
  }
  #modal-backdrop.show { opacity: 1; pointer-events: auto; }
  #modal-card {
    background: var(--lily);
    border: 1px solid var(--border);
    border-radius: 1rem;
    max-width: 26rem;
    width: 100%;
    padding: 2.25rem 2rem 1.75rem;
    text-align: center;
    box-shadow: 0 20px 50px rgba(62, 44, 35, 0.18);
    transform: translateY(14px) scale(0.98);
    transition: transform 0.3s ease;
    position: relative;
    max-height: calc(100vh - 3rem);
    overflow-y: auto;
    overflow-x: hidden;
  }
  #modal-backdrop.show #modal-card { transform: translateY(0) scale(1); }
  #modal-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--sage), var(--butter), var(--rose));
  }
  /* faint blush glow in the corner behind the note.
     Kept inside the card (no negative offsets) so it can't make the card scroll,
     and it fades to nothing before its own edges so there's no visible square. */
  #modal-card::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;
    width: 11rem;
    height: 11rem;
    background: radial-gradient(circle 11rem at 100% 100%, var(--blushpk), transparent);
    opacity: 0.5;
    pointer-events: none;
  }

  .divider-heart {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    color: var(--rose);
    margin: 1.1rem 0;
  }
  .divider-heart::before, .divider-heart::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .modal-eyebrow {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    margin-bottom: 0.5rem;
    color: var(--mocha);
  }
  #modal-title {
    font-size: 1.875rem;
    line-height: 2.25rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
    color: var(--espresso);
  }
  #modal-word { font-style: italic; font-size: 1.25rem; line-height: 1.75rem; color: var(--rose); }
  #modal-message {
    font-size: 0.95rem;
    line-height: 1.625;
    position: relative;
    z-index: 10;
    color: var(--mocha);
  }
  .next-word { margin-top: 1rem; font-size: 0.75rem; line-height: 1rem; color: var(--taupe); }
  #countdown { font-weight: 600; color: var(--mocha); }
  #modal-close {
    margin-top: 1rem;
    padding: 0.625rem 1.5rem;
    border-radius: 9999px;
    font-size: 0.875rem;
    line-height: 1.25rem;
    font-weight: 600;
    background: var(--espresso);
    color: var(--latte);
    position: relative;
    z-index: 10;
    transition: opacity 0.15s ease;
  }
  #modal-close:hover { opacity: 0.9; }

  .signature {
    font-family: 'Great Vibes', cursive;
    font-size: 1.7rem;
    color: var(--rose);
    margin-top: 1rem;
    line-height: 1;
  }

  /* ---------- Anniversary (every August 1): fireworks + bouquet ---------- */
  /* The bouquet lives in the love-note card but only exists on the day. */
  .anniv-only { display: none; }
  body.anniversary .anniv-only { display: block; }

  .bq {
    display: block;
    margin: 0.6rem auto 0;
    width: min(230px, 70vw);
    height: auto;
  }
  @media (max-height: 700px) {
    .bq { width: min(180px, 60vw); }
  }

  /* stems draw themselves upward */
  .bq .stem { stroke-dasharray: 1; }
  #modal-backdrop.show .bq .stem { animation: stem-grow 0.55s ease 0.1s both; }
  @keyframes stem-grow {
    from { stroke-dashoffset: 1; }
    to   { stroke-dashoffset: 0; }
  }

  /* each piece of the bouquet pops in from its base, in order */
  .bq .bqi { transform-box: fill-box; transform-origin: 50% 85%; }
  #modal-backdrop.show .bq .bqi { animation: bq-pop 0.7s cubic-bezier(0.2, 0.8, 0.3, 1.2) both; }
  #modal-backdrop.show .bq .d1 { animation-delay: 0.30s; }  /* paper wrap   */
  #modal-backdrop.show .bq .d2 { animation-delay: 0.42s; }  /* leaves       */
  #modal-backdrop.show .bq .d3 { animation-delay: 0.52s; }  /* left rosebud */
  #modal-backdrop.show .bq .d4 { animation-delay: 0.60s; }  /* right rosebud*/
  #modal-backdrop.show .bq .d5 { animation-delay: 0.68s; }  /* ribbon bow   */
  #modal-backdrop.show .bq .d6 { animation-delay: 0.78s; }  /* left lily    */
  #modal-backdrop.show .bq .d7 { animation-delay: 0.86s; }  /* right lily   */
  #modal-backdrop.show .bq .d8 { animation-delay: 0.96s; }  /* center lily  */
  #modal-backdrop.show .bq .d9 { animation-delay: 1.10s; }  /* baby's breath*/
  @keyframes bq-pop {
    from { transform: scale(0.2) translateY(10px); opacity: 0; }
    to   { transform: scale(1)   translateY(0);    opacity: 1; }
  }


  /* ========================= THE NOTE: paper, envelope, extras ========================= */
  #modal-card {
    z-index: 2;
    background-color: #FFFDF9;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .3  0 0 0 0 .22  0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* your message, in handwriting, typed out as the note opens */
  #modal-message {
    font-family: 'Caveat', cursive;
    font-size: 1.45rem;
    line-height: 1.32;
    font-weight: 500;
    color: #5A4336;
  }
  #modal-message .untyped { visibility: hidden; }

  /* she lost: a little pouty polaroid */
  .polaroid {
    width: 124px;
    margin: 0.2rem auto 1rem;
    padding: 7px 7px 0;
    background: #fff;
    box-shadow: 0 6px 16px rgba(62, 44, 35, 0.16);
    transform: rotate(-3deg);
    position: relative;
    z-index: 10;
  }
  .polaroid[hidden] { display: none; }
  .polaroid img { width: 110px; height: 118px; object-fit: cover; }
  .polaroid figcaption { font-family: 'Caveat', cursive; font-size: 1.1rem; color: var(--mocha); padding: 0.15rem 0 0.3rem; }
  #modal-backdrop.show .polaroid { animation: polaroid-drop 0.7s cubic-bezier(0.3, 1.4, 0.5, 1) 1.1s backwards; }
  @keyframes polaroid-drop {
    from { opacity: 0; transform: translateY(-24px) rotate(-14deg); }
    to   { opacity: 1; transform: rotate(-3deg); }
  }

  /* countdown with a tiny cup that refills as midnight gets closer */
  .next-word { display: flex; align-items: center; justify-content: center; gap: 0.4rem; }
  .cup-timer { width: 22px; height: 22px; flex: none; }

  .note-actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
    position: relative;
    z-index: 10;
  }
  #modal-close { margin-top: 0; }
  #share-btn {
    padding: 0.6rem 1.1rem;
    border-radius: 9999px;
    border: 1px solid var(--border);
    background: var(--key);
    color: var(--mocha);
    font-size: 0.8rem;
    font-weight: 600;
  }
  #share-btn:active, #modal-close:active { transform: scale(0.96); }

  /* the envelope (only while .opening) */
  #envelope {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 240px;
    height: 156px;
    margin: -78px 0 0 -120px;
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    perspective: 600px;
  }
  #envelope > div { position: absolute; }
  .env-back   { inset: 0; background: #E9D7C5; border-radius: 6px; box-shadow: 0 18px 40px rgba(62, 44, 35, 0.25); }
  .env-letter { left: 8%; right: 8%; top: 8%; height: 82%; background: #FFFDF9; border-radius: 4px; box-shadow: 0 2px 6px rgba(62, 44, 35, 0.12); }
  .env-front  { inset: 0; background: #F4E5D6; border-radius: 6px; clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%); }
  .env-flap   { left: 0; right: 0; top: 0; height: 60%; background: #EED9C6; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: 50% 0; z-index: 3; }
  .env-seal {
    left: 50%; top: 60%;
    width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border-radius: 50%;
    background: #C88A90;
    color: #fff;
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 5px rgba(120, 50, 60, 0.35);
    z-index: 4;
  }
  #modal-backdrop.opening #envelope { animation: env-life 1.5s cubic-bezier(0.3, 0.9, 0.4, 1) both; }
  #modal-backdrop.opening .env-flap { animation: env-flap 1.5s ease both; }
  #modal-backdrop.opening .env-seal { animation: env-seal 1.5s ease both; }
  #modal-backdrop.opening .env-letter { animation: env-letter 1.5s ease both; }
  #modal-backdrop.opening #modal-card { animation: card-rise 1.5s cubic-bezier(0.25, 0.9, 0.35, 1.05) both; }
  @keyframes env-life {
    0%   { opacity: 1; transform: translateY(70vh) rotate(-8deg); }
    24%  { opacity: 1; transform: translateY(0) rotate(0deg); }
    62%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(140px) scale(0.92); }
  }
  @keyframes env-flap {
    0%, 26% { transform: rotateX(0deg); z-index: 3; }
    40%     { transform: rotateX(180deg); z-index: 0; }
    100%    { transform: rotateX(180deg); z-index: 0; }
  }
  @keyframes env-seal {
    0%, 26% { opacity: 1; transform: scale(1); }
    34%, 100% { opacity: 0; transform: scale(1.6); }
  }
  @keyframes env-letter {
    0%, 38% { transform: translateY(0); }
    58%     { transform: translateY(-64px); }
    100%    { transform: translateY(-64px); }
  }
  @keyframes card-rise {
    0%, 48% { opacity: 0; transform: translateY(30px) scale(0.5); }
    78%     { opacity: 1; transform: translateY(-6px) scale(1.01); }
    100%    { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* after closing the note, a way back to it */
  #reopen-note {
    display: none;
    padding: 0.45rem 1.05rem;
    border-radius: 9999px;
    border: 1px solid var(--border);
    color: var(--mocha);
    background: var(--lily);
    font-size: 0.8rem;
    font-weight: 600;
  }
  #reopen-note.show { display: inline-block; animation: rise 0.5s ease both; }

  /* streak, next to the date */
  .streak {
    display: inline-block;
    margin-left: 0.45rem;
    padding: 0 0.5rem;
    border-radius: 999px;
    background: rgba(217, 160, 165, 0.18);
    color: #B5737A;
    font-weight: 600;
  }

  /* ========================= LITTLE MOMENTS ========================= */
  /* last guess: she peeks in from the left edge, hands on her head */
  #peeker {
    position: fixed;
    left: 0;
    top: 38%;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.35rem;
    transform: translateX(-130%) rotate(-14deg);
    transition: transform 0.55s cubic-bezier(0.3, 1.5, 0.5, 1);
    pointer-events: none;
  }
  #peeker.show { transform: translateX(10px) rotate(-5deg); }
  #peeker img {
    width: 86px;
    height: 86px;
    object-fit: cover;
    border-radius: 18px;
    border: 3px solid #fff;
    box-shadow: 0 8px 20px rgba(62, 44, 35, 0.25);
  }
  .peek-bubble {
    font-family: 'Caveat', cursive;
    font-size: 1.15rem;
    background: #fff;
    color: #5A4336;
    padding: 0.1rem 0.6rem;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(62, 44, 35, 0.15);
    white-space: nowrap;
  }

  /* FIRST TRY?! */
  .stamp {
    position: fixed;
    z-index: 46;
    pointer-events: none;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 2.3rem;
    letter-spacing: 0.04em;
    color: #C25E68;
    border: 4px solid #C25E68;
    border-radius: 12px;
    padding: 0.1rem 0.8rem;
    background: rgba(255, 253, 249, 0.88);
    white-space: nowrap;
    animation: stamp 2.4s ease both;
  }
  @keyframes stamp {
    0%   { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(3); }
    12%  { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg) scale(0.92); }
    18%  { transform: translate(-50%, -50%) rotate(-12deg) scale(1); }
    82%  { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(1.05); }
  }

  .fx-float {
    position: fixed;
    z-index: 70;
    pointer-events: none;
    font-family: 'Caveat', cursive;
    font-weight: 600;
    font-size: 1.6rem;
    color: #C25E68;
    text-shadow: 0 1px 3px rgba(253, 251, 247, 0.9);
    white-space: nowrap;
    animation: fx-float 1.4s ease-out forwards;
  }
  @keyframes fx-float {
    0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
    20%  { transform: translate(-50%, -90%) scale(1.12); opacity: 1; }
    100% { transform: translate(-50%, -260%) scale(1); opacity: 0; }
  }
  .burst.glyph { background: none; border-radius: 0; line-height: 1; width: auto; height: auto; }

  /* ========================= AMBIENT: seasons + night sky ========================= */
  .ambient, .night-sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .drift { position: absolute; top: -4rem; animation-timing-function: linear; animation-iteration-count: infinite; }
  .drift svg { width: 100%; height: 100%; display: block; }
  .drift.leaf { animation-name: leaf-fall; }
  @keyframes leaf-fall {
    0%   { transform: translate(0, -6vh) rotate(0deg); }
    25%  { transform: translate(2.6rem, 24vh) rotate(110deg) scaleX(0.7); }
    50%  { transform: translate(-1.8rem, 52vh) rotate(200deg) scaleX(1); }
    75%  { transform: translate(2.2rem, 80vh) rotate(290deg) scaleX(0.6); }
    100% { transform: translate(-1rem, 112vh) rotate(400deg) scaleX(1); }
  }
  .drift.flake {
    border-radius: 50%;
    background: radial-gradient(circle, #FFFFFF 35%, #DCCFC0 100%);
    animation-name: snow-fall;
  }
  @keyframes snow-fall {
    0%   { transform: translate(0, -4vh); }
    50%  { transform: translate(1.3rem, 52vh); }
    100% { transform: translate(-0.6rem, 108vh); }
  }
  .drift.candy { animation-name: leaf-fall; }
  .drift.bat { top: auto; left: 0; animation-name: bat-fly; }
  @keyframes bat-fly {
    0%   { transform: translate(-12vw, 0); }
    25%  { transform: translate(25vw, -4vh); }
    50%  { transform: translate(55vw, 3vh); }
    75%  { transform: translate(85vw, -3vh); }
    100% { transform: translate(115vw, 0); }
  }
  .bat .wing { transform-box: view-box; transform-origin: 32px 14px; animation: flap 0.22s ease-in-out infinite alternate; }
  @keyframes flap { to { transform: scaleY(0.25); } }

  .night-sky { opacity: 0; transition: opacity 1.2s ease; }
  .night-sky.on { opacity: 1; }
  .night-sky i {
    position: absolute;
    border-radius: 50%;
    background: #FFF4DE;
    box-shadow: 0 0 5px #FFF4DE;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

  /* ---------- time of day ---------- */
  body { transition: background-color 0.8s ease; }
  body.tod-morning {
    background:
      radial-gradient(130% 55% at 12% -5%, rgba(255, 228, 182, 0.9) 0%, rgba(255, 228, 182, 0) 60%),
      linear-gradient(180deg, #FFF7EA 0%, var(--latte) 55%);
  }
  body.tod-morning .steam path { animation-duration: 2s; }
  body.tod-evening {
    background:
      radial-gradient(140% 60% at 88% -8%, rgba(244, 196, 186, 0.85) 0%, rgba(244, 196, 186, 0) 58%),
      linear-gradient(180deg, #FBEDE6 0%, var(--latte) 60%);
  }
  body.tod-evening .lily-icon { filter: drop-shadow(0 0 6px rgba(217, 160, 165, 0.7)); }

  /* night: espresso dark. Only the page itself goes dark (.themed); the
     love note, toasts and special-day intros keep their own light colors. */
  :root:has(body.tod-night) { background: #1E1713; }
  body.tod-night {
    background: radial-gradient(120% 55% at 50% -10%, #3A2A22 0%, rgba(58, 42, 34, 0) 62%), #1E1713;
    color: #F2E7DC;
  }
  body.tod-night .themed {
    --latte: #1E1713;
    --espresso: #F2E7DC;
    --mocha: #CDB6A3;
    --border: #3B2E26;
    --key: #33281F;
    --lily: #271E19;
    --tile-border: #4A3A2F;
    --header-bg: rgba(30, 23, 19, 0.82);
  }
  body.tod-night .key { box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4); }
  body.tod-night .tile { box-shadow: none; }
  body.tod-night .ambient { opacity: 0.55; }
  body.tod-night .lily-icon { filter: drop-shadow(0 0 6px rgba(217, 160, 165, 0.55)); }
  body.tod-night .streak { color: #E3AAB0; }

  /* ========================= SHARED BITS FOR SPECIAL-DAY FILES ========================= */
  .sd { position: relative; z-index: 10; margin-top: 1.1rem; }
  .sd-stage {
    position: fixed;
    inset: 0;
    z-index: 58;
    overflow: hidden;
    cursor: pointer;
    background: rgba(253, 251, 247, 0.97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.3rem;
    transition: opacity 0.45s ease;
  }
  .sd-stage.clearing { opacity: 0; }
  .sd-say {
    font-family: 'Great Vibes', cursive;
    font-size: 1.75rem;
    line-height: 1.35;
    color: #6B5142;
    text-align: center;
    max-width: 300px;
    min-height: 2.4rem;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .sd-say.show { opacity: 1; transform: translateY(0); }
  .sd-skip {
    position: absolute;
    bottom: 1.6rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.62rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #B8AA9C;
  }
  .sd-name { display: block; font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--espresso); }
  .sd-line { display: block; font-family: 'Great Vibes', cursive; font-size: 1.15rem; color: var(--rose); min-height: 1.3rem; }
  .sd-actions { display: flex; justify-content: center; gap: 0.5rem; margin-top: 0.9rem; }
  .sd-btn {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.45rem 1.05rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--key);
    color: var(--mocha);
    transition: transform 0.06s ease, opacity 0.2s ease;
  }
  .sd-btn:active { transform: scale(0.95); }
  .sd-btn.main { background: var(--rose); border-color: var(--rose); color: #fff; }
  .sd-btn[disabled] { opacity: 0.55; cursor: default; }
  .sd-hint { font-size: 0.72rem; color: var(--taupe); margin-top: 0.6rem; animation: sd-pulse 2.4s ease-in-out infinite; }
  .sd-hint.gone { display: none; }
  @keyframes sd-pulse { 50% { opacity: 0.45; } }
  .sd-count { font-size: 0.72rem; font-weight: 600; color: var(--mocha); margin-top: 0.6rem; min-height: 1rem; }
  .sd-count.pop { animation: sd-pop 0.3s ease; }
  @keyframes sd-pop { 50% { transform: scale(1.13); } }
  .sd-photo { width: 150px; height: 150px; margin: 0 auto; border-radius: 50%; overflow: hidden; border: 4px solid #fff; box-shadow: 0 6px 18px rgba(62, 44, 35, 0.18); }
  .sd-photo img { width: 100%; height: 100%; object-fit: cover; }

  @media (prefers-reduced-motion: reduce) {
    .tile.flip, .tile.filled, .tile.dance, .tile.dance-big, .tile.phew, .tile.droop, .row.shake,
    .rise, .steam path, .lily-icon, .petal, .burst, .key.key-pop, .night-sky i, .sd-hint,
    .bq .stem, .bq .bqi, #modal-backdrop .polaroid { animation: none !important; }
    .rise { opacity: 1; }
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>

/* ---------- Hidden preview mode (for you, not for Amy) ----------
   Append ?peek=MM-DD to the URL to play any date, e.g.:
     index.html?peek=07-24   → birthday mode
     index.html?peek=09-26   → froth day
     index.html?peek=10-19   → floss day
     index.html?peek=10-23   → wolf moon
     index.html?peek=10-31   → halloween
     index.html?peek=11-01   → 9 months (works on any 1st of the month)
   The list of special days is DAY_FILES below; their code lives in days/.
   Add &fresh=1 to wipe that day's saved test progress and replay:
     index.html?peek=09-26&fresh=1
   Add &hour=HH to preview a time of day (morning 5–10, evening 17–20,
   night 21–4), e.g. index.html?peek=10-25&hour=23
   Preview progress is stored under separate "test-" keys, so testing
   never locks or affects a real day. */
const params = new URLSearchParams(location.search);
const peek = params.get("peek");
const isPeek = !!(peek && /^(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(peek));

const dateKey = isPeek ? peek : `${mm}-${dd}`;
const [playMonth, playDay] = dateKey.split("-").map(Number);
const storageKey = (isPeek ? "test-" : "") + `amy-wordle-${todayDate.getFullYear()}-${dateKey}`;
if (isPeek && params.get("fresh")) {
  try { localStorage.removeItem(storageKey); } catch (e) {}
}

/* Accents get stripped so the keyboard can type them (Râler → RALER).
   Anything still not A–Z after that can't be typed at all, so it's rejected. */
function typeable(w) {
  return String(w).normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toUpperCase();
}

function getToday() {
  const entry = WORDS[dateKey];
  if (entry && entry.word) {
    const word = typeable(entry.word);
    if (/^[A-Z]{5}$/.test(word)) {
      // `display` is what the note shows; defaults to the word as written, accents and all
      return { word, display: (entry.display || entry.word.trim()).toUpperCase(), message: entry.message };
    }
    console.warn(`WORDS["${dateKey}"]: "${entry.word}" isn't 5 typeable letters, using a fallback word`);
  }
  // fallback is picked from the date being played (the peek date in preview mode)
  const dayOfYear = Math.floor((new Date(todayDate.getFullYear(), playMonth - 1, playDay) - new Date(todayDate.getFullYear(), 0, 0)) / 86400000);
  const fb = FALLBACK_WORDS[dayOfYear % FALLBACK_WORDS.length];
  return { word: fb.word, display: fb.word, message: fb.message };
}

const hourParam = parseInt(params.get("hour"), 10);

const TOD_COLORS = { morning: "#FFF6E6", day: "#FDFBF7", evening: "#FBEFEA", night: "#1E1713" };

function timeOfDay(h) {
  if (h >= 5 && h < 11) return "morning";
  if (h >= 11 && h < 17) return "day";
  if (h >= 17 && h < 21) return "evening";
  return "night";
}

function setTimeOfDay(tod) {
  document.body.classList.remove("tod-morning", "tod-day", "tod-evening", "tod-night");
  document.body.classList.add("tod-" + tod);
  document.body.dataset.tod = tod;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = TOD_COLORS[tod];
  if (typeof Ambient !== "undefined") Ambient.stars(tod === "night");
}

/* season follows the date being played, so ?peek shows the right one */
function seasonFor(m, d) {
  const md = m * 100 + d;
  if (md >= 1201 || md < 301) return "winter";
  if (md >= 922) return "autumn";
  if (md >= 601) return "summer";
  return "spring";
}
const season = seasonFor(playMonth, playDay);
document.body.classList.add("season-" + season);

/* Whatever drifts behind the board: petals in spring/summer, leaves in
   autumn (with the odd early snowflake from Nov 20), snow in winter,
   plus twinkling stars at night. Special days can swap it with
   Ambient.set("bats") etc. */
const Ambient = (() => {
  const layer = document.createElement("div");

  const sky = document.createElement("div");

  const rand = (a, b) => a + Math.random() * (b - a);
  const LEAF_COLORS = ["#C26A3D", "#D99A4E", "#B5523B", "#E3C481", "#A8BBA0", "#9C5B3A"];
  const LEAF = '<svg viewBox="0 0 24 24"><path d="M12 2c3 3 7 4 9 3-1 4-2 7-5 9 1 2 1 4 0 6-2-1-3-2-4-4-1 2-2 3-4 4-1-2-1-4 0-6-3-2-4-5-5-9 2 1 6 0 9-3z" fill="currentColor"/><path d="M12 6v16" stroke="rgba(0,0,0,.18)" stroke-width="1"/></svg>';
  const CANDY_COLORS = ["#D9A0A5", "#E3C481", "#A8BBA0", "#C8A2D4", "#E8955A"];
  const CANDY = '<svg viewBox="0 0 40 20"><path d="M2 4l8 6-8 6zM38 4l-8 6 8 6z" fill="currentColor" opacity=".75"/><ellipse cx="20" cy="10" rx="10" ry="7.5" fill="currentColor"/><path d="M14 6c3 3 9 5 12 8" stroke="#fff" stroke-width="1.6" opacity=".6" fill="none"/></svg>';
  const BAT = '<svg viewBox="0 0 64 28"><g fill="#3E2C23"><path class="wing l" d="M32 14C26 6 14 3 2 6c6 2 8 6 8 10 4-3 8-3 10 0 2-3 6-3 8 0z"/><path class="wing r" d="M32 14c6-8 18-11 30-8-6 2-8 6-8 10-4-3-8-3-10 0-2-3-6-3-8 0z"/><ellipse cx="32" cy="15" rx="4" ry="5.5"/><path d="M29 10l1-4 2 3 2-3 1 4z"/></g></svg>';

  const MAKERS = {
    petals(p) {
      p.className = "drift petal";
      const s = rand(9, 20);
      p.style.width = s + "px"; p.style.height = s * 0.75 + "px";
      p.style.opacity = rand(0.3, 0.65).toFixed(2);
      return rand(13, 25);
    },
    leaves(p) {
      p.className = "drift leaf";
      const s = rand(13, 24);
      p.style.width = p.style.height = s + "px";
      p.style.color = LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)];
      p.style.opacity = rand(0.45, 0.8).toFixed(2);
      p.innerHTML = LEAF;
      return rand(11, 20);
    },
    snow(p) {
      p.className = "drift flake";
      const s = rand(3, 7);
      p.style.width = p.style.height = s + "px";
      p.style.opacity = rand(0.5, 0.95).toFixed(2);
      return rand(12, 22);
    },
    candy(p) {
      p.className = "drift candy";
      const s = rand(22, 32);
      p.style.width = s + "px"; p.style.height = s / 2 + "px";
      p.style.color = CANDY_COLORS[Math.floor(Math.random() * CANDY_COLORS.length)];
      p.innerHTML = CANDY;
      return rand(9, 15);
    },
    bats(p) {
      p.className = "drift bat";
      const s = rand(26, 44);
      p.style.width = s + "px"; p.style.height = s * 0.44 + "px";
      p.style.top = rand(6, 70) + "vh";
      p.style.opacity = rand(0.55, 0.9).toFixed(2);
      p.innerHTML = BAT;
      return rand(9, 16);
    },
  };

  function set(...kinds) {   // e.g. set("leaves", 12) or set("leaves", 12, "snow", 4)
    layer.innerHTML = "";
    if (reducedMotion) return;
    for (let k = 0; k < kinds.length; k += 2) {
      const make = MAKERS[kinds[k]], count = kinds[k + 1] || 12;
      for (let i = 0; i < count; i++) {
        const p = document.createElement("div");
        const dur = make(p);
        if (!p.style.top) p.style.left = rand(0, 100) + "vw";
        p.style.animationDuration = dur + "s";
        p.style.animationDelay = -rand(0, dur) + "s";   // pre-populate the sky
        layer.appendChild(p);
      }
    }
  }

  let starsMade = false;
  function stars(on) {
    sky.classList.toggle("on", on);
    if (!on || starsMade) return;
    starsMade = true;
    for (let i = 0; i < 46; i++) {
      const s = document.createElement("i");
      const big = Math.random() < 0.15;
      s.style.left = rand(0, 100) + "%";
      s.style.top = rand(0, 62) + "%";
      s.style.width = s.style.height = (big ? 2.6 : rand(1, 2)) + "px";
      s.style.animationDuration = rand(2.5, 6) + "s";
      s.style.animationDelay = -rand(0, 6) + "s";
      sky.appendChild(s);
    }
  }

  function seasonal() {
    const md = playMonth * 100 + playDay;
    if (season === "autumn") return md >= 1120 ? ["leaves", 10, "snow", 6] : ["leaves", 13];
    if (season === "winter") return ["snow", 26];
    return ["petals", 12];
  }

  return { set, stars, seasonal: () => set(...seasonal()) };
})();

/* Helpers every special-day file can use (all optional). */
const Special = {
  key: dateKey,
  name: dayFileFor(dateKey),
  reducedMotion,
  monthsTogether,
  card: document.getElementById("modal-card"),
  backdrop: document.getElementById("modal-backdrop"),
  title: null,                       // set this to replace the note's title
  hooks: { open: [], close: [], win: [], loss: [], guess: [] },
  timers: [],

  /* on("win", attempt => …) · on("loss") · on("guess", (row, guess, result) => …)
     on("open") when the note opens · on("close") when it closes */
  on(evt, fn) { this.hooks[evt].push(fn); },
  emit(evt, ...args) {
    for (const fn of this.hooks[evt]) {
      try { fn(...args); } catch (e) { console.error(e); }
    }
  },
  subtitle(text) { subtitleEl.textContent = text; },

  /* a block in the love note, just above "with all my love" */
  addToNote(className, html) {
    const el = document.createElement("div");
    el.className = "sd " + className;
    el.innerHTML = html;
    this.card.insertBefore(el, this.card.querySelector(".signature"));
    return el;
  },

  /* load a photo, with a soft placeholder if the file is missing */
  photo(img, src, word = "wu") {
    img.onerror = function () {
      this.onerror = null;
      this.src = "data:image/svg+xml;utf8," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#F3E8D2"/>' +
        '<text x="50" y="60" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#6B5142">' + word + "</text></svg>");
    };
    img.src = src;
    return img;
  },

  later(fn, ms) { const t = setTimeout(fn, ms); this.timers.push(t); return t; },
  clearLater() { this.timers.forEach(clearTimeout); this.timers = []; },

  center(el) {
    const r = el.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  },

  /* little words that pop up and float away */
  floatText(text, x, y, opts = {}) {
    if (reducedMotion) return;
    const f = document.createElement("span");
    f.className = "fx-float" + (opts.className ? " " + opts.className : "");
    f.textContent = text;
    f.style.left = x + "px";
    f.style.top = y + "px";
    if (opts.color) f.style.color = opts.color;
    if (opts.size) f.style.fontSize = opts.size;
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1500);
  },

  /* particles flying out from (x, y): colored petals by default, or any
     text/emoji/SVG via `html` (a string, an array to cycle, or a function) */
  burst({ x, y, count = 24, colors, html, size = [8, 18], spread = [70, 220], lift = 60, spin = 540, duration = 1.2 } = {}) {
    if (reducedMotion) return;
    if (x === undefined) [x, y] = this.center(boardEl);
    const palette = colors || BURST_COLORS;
    for (let i = 0; i < count; i++) {
      const p = document.createElement("div");
      p.className = "burst" + (html ? " glyph" : "");
      const s = size[0] + Math.random() * (size[1] - size[0]);
      if (html) {
        p.innerHTML = typeof html === "function" ? html(i) : Array.isArray(html) ? html[i % html.length] : html;
        p.style.fontSize = s + "px";
        p.style.color = palette[i % palette.length];
      } else {
        p.style.width = s + "px";
        p.style.height = s * 0.75 + "px";
        p.style.background = palette[i % palette.length];
      }
      p.style.left = x + "px";
      p.style.top = y + "px";
      p.style.animationDuration = duration + "s";
      const a = Math.random() * Math.PI * 2;
      const dist = spread[0] + Math.random() * (spread[1] - spread[0]);
      p.style.setProperty("--tx", Math.cos(a) * dist + "px");
      p.style.setProperty("--ty", (Math.sin(a) * dist - lift) + "px");
      p.style.setProperty("--rot", (Math.random() * spin - spin / 2) + "deg");
      document.body.appendChild(p);
      setTimeout(() => p.remove(), duration * 1000 + 150);
    }
  },

  /* a full-screen intro that plays before the note. Tap to skip.
     Returns { el, say(text), done() }; call done() when it's finished. */
  stage(html, { className = "", onDone } = {}) {
    const el = document.createElement("div");
    el.className = "sd-stage " + className;
    el.innerHTML = html + '<p class="sd-say"></p><p class="sd-skip">tap to skip</p>';
    document.body.appendChild(el);
    const cap = el.querySelector(".sd-say");
    let finished = false;
    const api = {
      el,
      say(text) {
        cap.classList.remove("show");
        Special.later(() => { cap.textContent = text; cap.classList.add("show"); }, 220);
      },
      done() {
        if (finished) return;
        finished = true;
        el.classList.add("clearing");
        setTimeout(() => el.remove(), 450);
        if (onDone) onDone();
      },
    };
    el.addEventListener("click", () => api.done());
    return api;
  },

  forceNight() { setTimeOfDay("night"); },
  ambient: Ambient,
};

/* bump this whenever you edit a file in days/, so phones don't keep an old copy
   (preview mode always loads fresh) */
const DAYS_VERSION = "2026-10-18";
function loadDay(name) {
  const v = isPeek ? Date.now() : DAYS_VERSION;
  const css = new Promise((resolve) => {
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = `days/${name}.css?v=${v}`;
    l.onload = l.onerror = resolve;
    document.head.appendChild(l);
  });
  const js = new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = `days/${name}.js?v=${v}`;
    s.onload = resolve;
    s.onerror = () => { console.warn(`couldn't load days/${name}.js`); resolve(); };
    document.body.appendChild(s);
  });
  return Promise.all([css, js]);
}
const dayReady = Special.name ? loadDay(Special.name) : Promise.resolve();

/* ========================= STREAK ========================= */
/* days in a row she's finished the puzzle (win or lose — showing up counts) */
function playedOn(d) {
  try {
    const s = JSON.parse(localStorage.getItem(`amy-wordle-${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`));
    return !!s && (s.status === "won" || s.status === "lost");
  } catch (e) { return false; }
}
function streak() {
  const d = new Date(todayDate.getFullYear(), todayDate.getMonth(), todayDate.getDate());
  if (!playedOn(d)) d.setDate(d.getDate() - 1);   // today not finished yet: count up to yesterday
  let n = 0;
  while (n < 3660 && playedOn(d)) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function renderTodayLine() {
  if (isPeek) { todayLineEl.textContent = "preview · " + dateKey + (hourParam >= 0 ? " · " + hourParam + ":00" : ""); return; }
  const date = todayDate.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  const n = streak();
  todayLineEl.innerHTML = "";
  todayLineEl.append(date);
  if (n >= 2) {
    const chip = document.createElement("span");
    chip.className = "streak";
    chip.textContent = n + " days in a row";
    todayLineEl.append(chip);
  }
}
renderTodayLine();

/* ========================= BOARD ========================= */
const boardEl = document.getElementById("board");
for (let r = 0; r < ROWS; r++) {
  const row = document.createElement("div");
  row.className = "row";
  const tiles = [];
  for (let c = 0; c < COLS; c++) {
    const t = document.createElement("div");
    t.className = "tile";
    row.appendChild(t);
    tiles.push(t);
  }
  boardEl.appendChild(row);
  boardTiles.push(tiles);
}

/* ========================= KEYBOARD ========================= */
const KEY_ROWS = [
  ["Q","W","E","R","T","Y","U","I","O","P"],
  ["A","S","D","F","G","H","J","K","L"],
  ["ENTER","Z","X","C","V","B","N","M","BACK"],
];
const keyboardEl = document.getElementById("keyboard");
const keyEls = {};

KEY_ROWS.forEach((keys) => {
  const rowEl = document.createElement("div");
  rowEl.className = "key-row";
  keys.forEach((k) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "key" + (k.length > 1 ? " wide" : "");
    btn.textContent = k === "BACK" ? "⌫" : k;
    btn.setAttribute("aria-label", k === "BACK" ? "backspace" : k);
    btn.addEventListener("click", () => handleKey(k));
    rowEl.appendChild(btn);
    keyEls[k] = btn;
  });
  keyboardEl.appendChild(rowEl);
});

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Enter") handleKey("ENTER");
  else if (e.key === "Backspace") handleKey("BACK");
  else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
});

/* ========================= INPUT ========================= */
function handleKey(k) {
  if (gameOver) return;
  if (k === "ENTER") return submitGuess();
  if (k === "BACK") {
    if (currentGuess.length > 0) {
      currentGuess = currentGuess.slice(0, -1);
      const t = boardTiles[currentRow][currentGuess.length];
      t.textContent = "";
      t.classList.remove("filled");
    }
    return;
  }
  if (currentGuess.length < COLS) {
    const t = boardTiles[currentRow][currentGuess.length];
    t.textContent = k;
    t.classList.remove("filled");
    void t.offsetWidth;
    t.classList.add("filled");
    currentGuess += k;
  }
}

/* ========================= EVALUATION ========================= */
function evaluate(guess, answer) {
  const result = new Array(COLS).fill("absent");
  const remaining = {};
  for (let i = 0; i < COLS; i++) {
    if (guess[i] === answer[i]) result[i] = "correct";
    else remaining[answer[i]] = (remaining[answer[i]] || 0) + 1;
  }
  for (let i = 0; i < COLS; i++) {
    if (result[i] === "correct") continue;
    if (remaining[guess[i]] > 0) {
      result[i] = "present";
      remaining[guess[i]]--;
    }
  }
  return result;
}

const RANK = { absent: 0, present: 1, correct: 2 };
/* `animate` = after a live guess: keys that just changed color pop in a
   little ripple, left to right in the order they were guessed */
function updateKeyStates(guess, result, animate) {
  const changed = [];
  for (let i = 0; i < COLS; i++) {
    const L = guess[i], s = result[i];
    if (!keyStates[L] || RANK[s] > RANK[keyStates[L]]) {
      keyStates[L] = s;
      if (!changed.includes(L)) changed.push(L);
    }
  }
  Object.entries(keyStates).forEach(([L, s]) => {
    if (keyEls[L]) {
      keyEls[L].classList.remove("correct", "present", "absent");
      keyEls[L].classList.add(s);
    }
  });
  if (animate && !reducedMotion) {
    changed.forEach((L, i) => {
      const k = keyEls[L];
      if (!k) return;
      k.style.animationDelay = i * 70 + "ms";
      k.classList.remove("key-pop");
      void k.offsetWidth;
      k.classList.add("key-pop");
    });
  }
}

/* ========================= SUBMIT ========================= */
const FLIP_STEP = 300;     // ms between tiles
const FLIP_HALF = 300;     // the tile's color changes when it's edge-on

function submitGuess() {
  if (currentGuess.length < COLS) {
    showToast("Not enough letters, love ☕");
    boardEl.children[currentRow].classList.add("shake");
    setTimeout(() => boardEl.children[currentRow].classList.remove("shake"), 500);
    return;
  }

  const guess = currentGuess;
  const result = evaluate(guess, ANSWER);
  const row = boardTiles[currentRow];
  gameOver = true; // lock input during animation

  row.forEach((tile, i) => {
    setTimeout(() => {
      tile.classList.add("flip");
      setTimeout(() => tile.classList.add(result[i]), FLIP_HALF);
    }, i * FLIP_STEP);
  });

  const totalDelay = COLS * FLIP_STEP + 300;
  setTimeout(() => {
    updateKeyStates(guess, result, true);
    guessResults.push(result);
    const won = guess === ANSWER;
    const attempt = currentRow + 1;
    Special.emit("guess", currentRow, guess, result);
    currentRow++;
    currentGuess = "";
    saveState(won ? "won" : currentRow >= ROWS ? "lost" : "playing");

    if (won) {
      const wait = celebrate(row, attempt);
      Special.emit("win", attempt);
      setTimeout(() => endGame(true, attempt), wait);
    } else if (currentRow >= ROWS) {
      const wait = commiserate();
      Special.emit("loss");
      setTimeout(() => endGame(false), wait);
    } else {
      gameOver = false;
      if (currentRow === ROWS - 1) lastGuessPeek();
    }
  }, totalDelay);
}

/* ========================= WIN / LOSS MOMENTS ========================= */
/* Bigger party for fewer guesses. Returns how long to wait before the note. */
function celebrate(row, attempt) {
  if (little && little.floats && !reducedMotion) {
    row.forEach((tile, i) => setTimeout(() => {
      const [x, y] = Special.center(tile);
      Special.floatText(little.floats[i % little.floats.length], x, y - 20);
    }, 200 + i * 140));
  }

  if (attempt === 1) {
    row.forEach((tile, i) => setTimeout(() => tile.classList.add("dance-big"), i * 80));
    stamp("FIRST TRY?!");
    petalBurst();
    Special.later(() => Special.burst({ count: 30, html: "♥", colors: ["var(--rose)", "#E8B7BC", "var(--butter)"], size: [14, 26], spread: [90, 260] }), 450);
    Special.later(petalBurst, 900);
    return 2200;
  }
  if (attempt === 2) {
    row.forEach((tile, i) => setTimeout(() => tile.classList.add("dance-big"), i * 80));
    petalBurst();
    Special.later(petalBurst, 450);
    return 1500;
  }
  if (attempt === ROWS) {
    // phew: a slow, relieved little bounce
    row.forEach((tile, i) => setTimeout(() => tile.classList.add("phew"), i * 110));
    Special.later(() => {
      const [x, y] = Special.center(row[2]);
      Special.floatText("phew", x, y - 30, { size: "2rem" });
      Special.burst({ count: 12 });
    }, 500);
    return 1600;
  }
  row.forEach((tile, i) => setTimeout(() => tile.classList.add("dance"), i * 90));
  petalBurst();
  return 1000;
}

/* a big rubber stamp that thumps onto the board */
function stamp(text) {
  if (reducedMotion) return;
  const s = document.createElement("div");
  s.className = "stamp";
  s.textContent = text;
  const r = boardEl.getBoundingClientRect();
  s.style.left = r.left + r.width / 2 + "px";
  s.style.top = r.top + r.height * 0.42 + "px";
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 2400);
}

/* she ran out of guesses: the board droops a little, then the note */
function commiserate() {
  if (reducedMotion) return 400;
  boardTiles.forEach((tiles, r) => setTimeout(() => tiles.forEach((t) => t.classList.add("droop")), r * 90));
  return 1300;
}

/* last guess: she peeks in, hands on head */
let peekShown = false;
function lastGuessPeek() {
  if (peekShown || reducedMotion) return;
  peekShown = true;
  const el = document.getElementById("peeker");
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 3000);
}

/* ========================= VICTORY PETAL BURST ========================= */
const BURST_COLORS = ["var(--sage)", "var(--butter)", "var(--rose)", "var(--blushpk)", "var(--lily)"];
function petalBurst() {
  if (reducedMotion) return;
  const rect = boardEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  for (let i = 0; i < 26; i++) {
    const p = document.createElement("div");
    p.className = "burst";
    const size = 8 + Math.random() * 10;
    p.style.width = size + "px";
    p.style.height = size * 0.75 + "px";
    p.style.left = cx + "px";
    p.style.top = cy + "px";
    p.style.background = BURST_COLORS[i % BURST_COLORS.length];
    const angle = Math.random() * Math.PI * 2;
    const dist = 70 + Math.random() * 150;
    p.style.setProperty("--tx", Math.cos(angle) * dist + "px");
    p.style.setProperty("--ty", (Math.sin(angle) * dist - 60) + "px"); // bias upward
    p.style.setProperty("--rot", (Math.random() * 540 - 270) + "deg");
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1300);
  }
}

/* ========================= ANNIVERSARY FIREWORKS ========================= */
/* Soft fireworks that pop behind the love-note card. The dimmed modal
   backdrop acts as the night sky, so the sparks glow against it.
   Launched every time the note opens on August 1. */
function fireworksShow() {
  if (reducedMotion) return;
  if (document.getElementById("fw-canvas")) return; // one show at a time

  const cv = document.createElement("canvas");
  cv.id = "fw-canvas";
  cv.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;";
  const card = document.getElementById("modal-card");
  backdrop.insertBefore(cv, card);

  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W * DPR;
  cv.height = H * DPR;
  const ctx = cv.getContext("2d");
  ctx.scale(DPR, DPR);

  const COLORS = ["#E8B7BC", "#EFD29A", "#BFD0B6", "#FBE3E5", "#FFF3E2"];
  let rockets = [], sparks = [], launched = 0;
  const LAUNCHES = 6;

  function launch() {
    rockets.push({
      x: W * (0.15 + Math.random() * 0.7),
      y: H + 8,
      vx: (Math.random() - 0.5) * 1.4,
      vy: -(H * 0.0085 + 2 + Math.random() * 1.5),
      color: COLORS[launched % COLORS.length],
    });
    launched++;
    if (launched < LAUNCHES) setTimeout(launch, 420 + Math.random() * 480);
  }

  function explode(x, y, color) {
    const n = 34 + Math.floor(Math.random() * 14);
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.25;
      const sp = 1.6 + Math.random() * 2.4;
      sparks.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 0.011 + Math.random() * 0.011,
        r: 1.4 + Math.random() * 1.3,
        color: Math.random() < 0.7 ? color : "#FFF9F0",
      });
    }
  }

  let raf;
  function frame() {
    ctx.clearRect(0, 0, W, H);

    // rockets: bright streaks climbing
    for (const r of rockets) {
      r.x += r.vx;
      r.y += r.vy;
      r.vy += 0.07; // gravity slows the climb
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(r.x - r.vx * 3, r.y - r.vy * 3);
      ctx.lineTo(r.x, r.y);
      ctx.stroke();
    }
    rockets = rockets.filter(r => {
      if (r.vy >= -1.2 || r.y < H * 0.22) {
        explode(r.x, r.y, r.color);
        return false;
      }
      return true;
    });

    // sparks: glowing embers drifting down
    for (const s of sparks) {
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.035;
      s.vx *= 0.985;
      s.vy *= 0.985;
      s.life -= s.decay;
      if (s.life > 0) {
        ctx.globalAlpha = Math.max(s.life, 0);
        ctx.fillStyle = s.color;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    sparks = sparks.filter(s => s.life > 0);

    if (launched >= LAUNCHES && rockets.length === 0 && sparks.length === 0) {
      cancelAnimationFrame(raf);
      cv.remove();
      return;
    }
    raf = requestAnimationFrame(frame);
  }

  launch();
  raf = requestAnimationFrame(frame);
  setTimeout(() => { // safety cleanup
    if (cv.isConnected) { cancelAnimationFrame(raf); cv.remove(); }
  }, 12000);
}

/* ========================= END / MODAL ========================= */
const WIN_TITLES = ["Genius!", "Brilliant!", "Wonderful!", "Beautiful!", "You did it!", "Just in time!"];
const backdrop = document.getElementById("modal-backdrop");
const afterGameBtn = document.getElementById("reopen-note");
let lastEnding = null;

async function endGame(won, attempt) {
  gameOver = true;
  await dayReady;              // make sure today's special day is ready to catch the note opening
  const title = dateKey === ANNIVERSARY
    ? "Happy Anniversary!"
    : won
      ? WIN_TITLES[Math.min(attempt - 1, WIN_TITLES.length - 1)]
      : "The word was…";
  lastEnding = { title, won };
  openModal(title, won);
  renderTodayLine();           // streak just went up
}

function openModal(title, won) {
  document.getElementById("modal-title").textContent = Special.title || title;
  document.getElementById("modal-word").textContent = "“" + today.display + "”";
  document.getElementById("loss-face").hidden = won;
  afterGameBtn.classList.remove("show");

  // the note comes out of an envelope, then writes itself
  backdrop.classList.toggle("opening", !reducedMotion);
  backdrop.classList.add("show");
  setTimeout(() => backdrop.classList.remove("opening"), 1500);
  typeMessage(today.message, reducedMotion ? 0 : 1150);

  if (dateKey === ANNIVERSARY) fireworksShow();
  startCountdown();
  Special.emit("open");
}

function closeModal() {
  backdrop.classList.remove("show", "opening");
  if (gameOver && lastEnding) afterGameBtn.classList.add("show");
  Special.emit("close");
}
document.getElementById("modal-close").addEventListener("click", closeModal);
backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeModal(); });
afterGameBtn.addEventListener("click", () => { if (lastEnding) openModal(lastEnding.title, lastEnding.won); });

/* handwritten note, typed out. The untyped rest sits there invisibly so
   nothing jumps around while it writes. */
let typeTimer;
function typeMessage(text, delay) {
  const el = document.getElementById("modal-message");
  clearTimeout(typeTimer);
  el.setAttribute("aria-label", text);
  const chars = Array.from(text);
  if (reducedMotion) { el.textContent = text; return; }
  el.innerHTML = '<span class="typed" aria-hidden="true"></span><span class="untyped" aria-hidden="true"></span>';
  const typed = el.firstChild, rest = el.lastChild;
  rest.textContent = text;
  const step = Math.max(12, Math.min(38, 2200 / chars.length));
  let i = 0;
  function next() {
    i++;
    typed.textContent = chars.slice(0, i).join("");
    rest.textContent = chars.slice(i).join("");
    if (i < chars.length) typeTimer = setTimeout(next, step);
  }
  typeTimer = setTimeout(next, delay);
}

/* "next word in" — and a little cup that refills as midnight gets closer */
let countdownTimer;
function startCountdown() {
  const el = document.getElementById("countdown");
  const fill = document.getElementById("cup-fill");
  function tick() {
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    let s = Math.floor((next - now) / 1000);
    const h = String(Math.floor(s / 3600)).padStart(2, "0");
    const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
    const sec = String(s % 60).padStart(2, "0");
    el.textContent = `${h}:${m}:${sec}`;
    const full = 1 - s / 86400;
    fill.setAttribute("y", (19 - 9 * full).toFixed(2));
    fill.setAttribute("height", (9 * full).toFixed(2));
  }
  tick();
  clearInterval(countdownTimer);
  countdownTimer = setInterval(tick, 1000);
}

/* ========================= SHARE ========================= */
/* her board as emoji squares, sent to you from her phone's share sheet */
function shareText() {
  const marks = { correct: "🟩", present: "🟨", absent: "⬜" };
  const last = guessResults[guessResults.length - 1];
  const won = !!last && last.every((x) => x === "correct");
  const date = new Date(todayDate.getFullYear(), playMonth - 1, playDay)
    .toLocaleDateString("en-US", { month: "short", day: "numeric" });
  return `Amy's Wordle · ${date} · ${won ? guessResults.length : "X"}/6\n` +
    guessResults.map((r) => r.map((x) => marks[x]).join("")).join("\n");
}
document.getElementById("share-btn").addEventListener("click", async () => {
  const text = shareText();
  if (navigator.share) {
    try { await navigator.share({ text }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  try {
    await navigator.clipboard.writeText(text);
    showToast("Copied — paste it to me :)");
  } catch (e) {
    showToast("Couldn't copy, screenshot it instead :)");
  }
});

/* New day while the page is still open (or the phone wakes up the next
   morning)? Reload so the new word shows up instead of yesterday's board. */
const loadedDay = todayDate.toDateString();
function checkNewDay() {
  if (!isPeek && new Date().toDateString() !== loadedDay) location.reload();
}
setInterval(checkNewDay, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkNewDay(); });

/* ========================= TOAST ========================= */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ========================= PERSISTENCE ========================= */
function saveState(status) {
  const guesses = [];
  for (let r = 0; r < currentRow; r++) {
    guesses.push(boardTiles[r].map((t) => t.textContent).join(""));
  }
  try {
    localStorage.setItem(storageKey, JSON.stringify({ guesses, status }));
  } catch (e) { /* private browsing — game still works, just won't persist */ }
}

function restoreState() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem(storageKey)); } catch (e) { return; }
  if (!saved || !Array.isArray(saved.guesses)) return;

  saved.guesses.forEach((guess, r) => {
    const result = evaluate(guess, ANSWER);
    boardTiles[r].forEach((tile, i) => {
      tile.textContent = guess[i];
      tile.classList.add(result[i]);
    });
    updateKeyStates(guess, result);
    guessResults.push(result);
  });
  currentRow = saved.guesses.length;

  if (saved.status === "won") {
    gameOver = true;
    setTimeout(() => endGame(true, currentRow), 500);
  } else if (saved.status === "lost") {
    gameOver = true;
    setTimeout(() => endGame(false), 500);
  }
}

restoreState();
</script>
