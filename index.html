<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Amy's Daily Wordle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Amy's Wordle" />
<meta name="theme-color" content="#FDFBF7" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --latte:    #FDFBF7;  /* warm latte cream background     */
    --espresso: #3E2C23;  /* rich espresso brown             */
    --mocha:    #6B5142;  /* softer brown for secondary text */
    --lily:     #FFFFFF;  /* lily white                      */
    --sage:     #A8BBA0;  /* soft sage green  = correct      */
    --butter:   #E3C481;  /* warm buttery gold = present     */
    --taupe:    #C7BCB1;  /* muted taupe gray = absent       */
    --rose:     #D9A0A5;  /* gentle rose-pink accent         */
    --blushpk:  #F3D7DA;  /* pale petal pink                 */
    --border:   #E4DCD1;  /* light coffee-cream border       */
    --key:      #F1EAE0;  /* keyboard key resting color      */
  }

  html, body {
    background: var(--latte);
    color: var(--espresso);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  .font-display { font-family: 'Playfair Display', serif; }
  .font-script  { font-family: 'Great Vibes', cursive; }

  /* ---------- Page-load reveal ---------- */
  .rise { animation: rise 0.7s ease both; }
  .rise-1 { animation-delay: 0.05s; }
  .rise-2 { animation-delay: 0.18s; }
  .rise-3 { animation-delay: 0.32s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Coffee steam ---------- */
  .steam path {
    opacity: 0;
    animation: steam-rise 2.8s ease-in-out infinite;
  }
  .steam path:nth-child(2) { animation-delay: 0.7s; }
  .steam path:nth-child(3) { animation-delay: 1.4s; }
  @keyframes steam-rise {
    0%   { opacity: 0;   transform: translateY(2px); }
    35%  { opacity: 0.8; }
    100% { opacity: 0;   transform: translateY(-4px); }
  }

  /* ---------- Lily sway ---------- */
  .lily-icon {
    animation: sway 5.5s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-4deg); }
    50%      { transform: rotate(4deg); }
  }

  /* ---------- Drifting lily petals (ambient background) ---------- */
  .petal {
    position: fixed;
    top: -4rem;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 30% 30%, var(--lily) 0%, var(--blushpk) 75%);
    border-radius: 65% 35% 60% 40% / 55% 45% 65% 35%;
    box-shadow: 0 1px 3px rgba(217, 160, 165, 0.15);
    animation: petal-fall linear infinite;
  }
  @keyframes petal-fall {
    0%   { transform: translateY(-6vh)  translateX(0)       rotate(0deg); }
    25%  { transform: translateY(26vh)  translateX(2.4rem)  rotate(75deg); }
    50%  { transform: translateY(52vh)  translateX(-1.6rem) rotate(160deg); }
    75%  { transform: translateY(78vh)  translateX(2rem)    rotate(235deg); }
    100% { transform: translateY(110vh) translateX(-1rem)   rotate(330deg); }
  }

  /* ---------- Victory petal burst ---------- */
  .burst {
    position: fixed;
    z-index: 45;
    pointer-events: none;
    border-radius: 65% 35% 60% 40% / 55% 45% 65% 35%;
    animation: burst 1.2s cubic-bezier(0.16, 0.6, 0.4, 1) forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0, 0) rotate(0deg) scale(0.6); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1); opacity: 0; }
  }

  /* ---------- Tiles ---------- */
  .tile {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.4rem, 6vw, 2rem);
    font-weight: 700;
    text-transform: uppercase;
    border: 2px solid var(--border);
    border-radius: 0.5rem;
    background: var(--lily);
    color: var(--espresso);
    user-select: none;
    box-shadow: 0 1px 2px rgba(62, 44, 35, 0.04);
    transition: transform 0.1s ease, border-color 0.15s ease;
  }
  .tile.filled {
    border-color: var(--mocha);
    animation: pop 0.12s ease;
  }
  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .tile.flip { animation: flip 0.55s ease forwards; }
  @keyframes flip {
    0%   { transform: rotateX(0deg); }
    50%  { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }
  .tile.correct { background: var(--sage);   border-color: var(--sage);   color: #FFFFFF; }
  .tile.present { background: var(--butter); border-color: var(--butter); color: #FFFFFF; }
  .tile.absent  { background: var(--taupe);  border-color: var(--taupe);  color: #FFFFFF; }

  .row.shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .tile.dance { animation: dance 0.5s ease; }
  @keyframes dance {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  /* ---------- Keyboard ---------- */
  .key {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: clamp(0.8rem, 3.2vw, 0.95rem);
    text-transform: uppercase;
    background: var(--key);
    color: var(--espresso);
    border-radius: 0.45rem;
    height: 3.4rem;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    transition: background 0.15s ease, color 0.15s ease, transform 0.05s ease;
    user-select: none;
  }
  .key:active { transform: scale(0.94); }
  .key.wide { flex: 1.6; font-size: 0.72rem; letter-spacing: 0.03em; }
  .key.correct { background: var(--sage);   color: #fff; }
  .key.present { background: var(--butter); color: #fff; }
  .key.absent  { background: var(--taupe);  color: #fff; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    top: 6.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--espresso);
    color: var(--latte);
    padding: 0.6rem 1.2rem;
    border-radius: 0.5rem;
    font-size: 0.9rem;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 60;
  }
  #toast.show { opacity: 1; }

  /* ---------- Modal (love-note card) ---------- */
  #modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(62, 44, 35, 0.45);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 50;
  }
  #modal-backdrop.show { opacity: 1; pointer-events: auto; }
  #modal-card {
    background: var(--lily);
    border: 1px solid var(--border);
    border-radius: 1rem;
    max-width: 26rem;
    width: 100%;
    padding: 2.25rem 2rem 1.75rem;
    text-align: center;
    box-shadow: 0 20px 50px rgba(62, 44, 35, 0.18);
    transform: translateY(14px) scale(0.98);
    transition: transform 0.3s ease;
    position: relative;
    max-height: calc(100vh - 3rem);
    overflow-y: auto;
    overflow-x: hidden;
  }
  #modal-backdrop.show #modal-card { transform: translateY(0) scale(1); }
  #modal-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--sage), var(--butter), var(--rose));
  }
  /* faint lily watermark behind the note */
  #modal-card::after {
    content: "";
    position: absolute;
    right: -2.5rem;
    bottom: -2.5rem;
    width: 11rem;
    height: 11rem;
    background: radial-gradient(ellipse at 30% 30%, var(--blushpk), transparent 70%);
    opacity: 0.5;
    pointer-events: none;
  }

  .divider-heart {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    color: var(--rose);
    margin: 1.1rem 0;
  }
  .divider-heart::before, .divider-heart::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .signature {
    font-family: 'Great Vibes', cursive;
    font-size: 1.7rem;
    color: var(--rose);
    margin-top: 1rem;
    line-height: 1;
  }

  /* ---------- Anniversary (every August 1): fireworks + bouquet ---------- */
  /* The bouquet lives in the love-note card but only exists on the day. */
  .anniv-only { display: none; }
  body.anniversary .anniv-only { display: block; }

  .bq {
    display: block;
    margin: 0.6rem auto 0;
    width: min(230px, 70vw);
    height: auto;
  }
  @media (max-height: 700px) {
    .bq { width: min(180px, 60vw); }
  }

  /* stems draw themselves upward */
  .bq .stem { stroke-dasharray: 1; }
  #modal-backdrop.show .bq .stem { animation: stem-grow 0.55s ease 0.1s both; }
  @keyframes stem-grow {
    from { stroke-dashoffset: 1; }
    to   { stroke-dashoffset: 0; }
  }

  /* each piece of the bouquet pops in from its base, in order */
  .bq .bqi { transform-box: fill-box; transform-origin: 50% 85%; }
  #modal-backdrop.show .bq .bqi { animation: bq-pop 0.7s cubic-bezier(0.2, 0.8, 0.3, 1.2) both; }
  #modal-backdrop.show .bq .d1 { animation-delay: 0.30s; }  /* paper wrap   */
  #modal-backdrop.show .bq .d2 { animation-delay: 0.42s; }  /* leaves       */
  #modal-backdrop.show .bq .d3 { animation-delay: 0.52s; }  /* left rosebud */
  #modal-backdrop.show .bq .d4 { animation-delay: 0.60s; }  /* right rosebud*/
  #modal-backdrop.show .bq .d5 { animation-delay: 0.68s; }  /* ribbon bow   */
  #modal-backdrop.show .bq .d6 { animation-delay: 0.78s; }  /* left lily    */
  #modal-backdrop.show .bq .d7 { animation-delay: 0.86s; }  /* right lily   */
  #modal-backdrop.show .bq .d8 { animation-delay: 0.96s; }  /* center lily  */
  #modal-backdrop.show .bq .d9 { animation-delay: 1.10s; }  /* baby's breath*/
  @keyframes bq-pop {
    from { transform: scale(0.2) translateY(10px); opacity: 0; }
    to   { transform: scale(1)   translateY(0);    opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile.flip, .tile.filled, .tile.dance, .row.shake,
    .rise, .steam path, .lily-icon, .petal, .burst,
    .bq .stem, .bq .bqi { animation: none !important; }
    .rise { opacity: 1; }
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Shared gradients for the anniversary bouquet lilies -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="lilyPetalG" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="47">
        <stop offset="0%" stop-color="#E5AFB4"/>
        <stop offset="28%" stop-color="#F3D7DA"/>
        <stop offset="62%" stop-color="#FBEDEE"/>
        <stop offset="100%" stop-color="#FFFFFF"/>
      </radialGradient>
      <radialGradient id="lilyPetalBackG" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="47">
        <stop offset="0%" stop-color="#D9A0A5"/>
        <stop offset="100%" stop-color="#F6E0E2"/>
      </radialGradient>
    </defs>
  </svg>

  <!-- ============ HEADER ============ -->
  <header class="w-full border-b relative z-10 rise rise-1" style="border-color: var(--border); background: rgba(253,251,247,0.92);">
    <div class="max-w-lg mx-auto flex items-center justify-center gap-3.5 py-4 px-4">
      <!-- Coffee cup with rising steam -->
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--mocha)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g class="steam">
          <path d="M8 7c.6-.9-.6-1.7 0-2.8"/>
          <path d="M11.5 7c.6-.9-.6-1.7 0-2.8"/>
          <path d="M15 7c.6-.9-.6-1.7 0-2.8"/>
        </g>
        <path d="M17 10h1a3 3 0 0 1 0 6h-1"/>
        <path d="M4 10h13v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-5z"/>
      </svg>

      <div class="text-center">
        <h1 class="font-display text-2xl sm:text-3xl font-semibold tracking-wide" style="color: var(--espresso);">Amy's Daily Wordle</h1>
        <p class="text-[0.7rem] uppercase tracking-[0.25em] mt-0.5" style="color: var(--rose);">a word a day, from me to you</p>
        <p id="today-line" class="text-[0.7rem] mt-1 font-medium" style="color: var(--mocha);"></p>
      </div>

      <!-- Swaying lily -->
      <svg class="lily-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--rose)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22V10"/>
        <path d="M12 10C12 6 9 3 6 2c0 4 1.5 7 6 8z"/>
        <path d="M12 10c0-4 3-7 6-8 0 4-1.5 7-6 8z"/>
        <path d="M12 14c-1.5 1-4 1.2-6 .5 1.2 2.4 3.8 3.5 6 2.5"/>
        <path d="M12 14c1.5 1 4 1.2 6 .5-1.2 2.4-3.8 3.5-6 2.5"/>
      </svg>
    </div>
  </header>

  <!-- ============ TOAST ============ -->
  <div id="toast" role="status"></div>

  <!-- ============ GAME ============ -->
  <main class="flex-1 w-full max-w-lg mx-auto flex flex-col items-center justify-between px-3 py-4 gap-4 relative z-10">
    <div id="board" class="grid grid-rows-6 gap-1.5 w-full max-w-[21rem] rise rise-2" aria-label="game board"></div>
    <div id="keyboard" class="w-full max-w-[32rem] flex flex-col gap-1.5 pb-2 rise rise-3" aria-label="on-screen keyboard"></div>
  </main>

  <!-- ============ MODAL ============ -->
  <div id="modal-backdrop">
    <div id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <p class="text-[0.65rem] uppercase tracking-[0.3em] mb-2" style="color: var(--mocha);">Amy's Daily Wordle</p>
      <h2 id="modal-title" class="font-display text-3xl font-semibold mb-1" style="color: var(--espresso);"></h2>
      <p id="modal-word" class="font-display italic text-xl" style="color: var(--rose);"></p>

      <div class="divider-heart" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--rose)"><path d="M12 21s-7.5-4.8-10-9.3C.4 8.6 2.4 5 5.8 5c2 0 3.4 1.1 4.2 2.4h4c.8-1.3 2.2-2.4 4.2-2.4 3.4 0 5.4 3.6 3.8 6.7C19.5 16.2 12 21 12 21z" transform="scale(0.9) translate(1.3,1.3)"/></svg>
      </div>

      <p id="modal-message" class="text-[0.95rem] leading-relaxed relative z-10" style="color: var(--mocha);"></p>

      <!-- Anniversary bouquet: hand-tied, assembles itself when the note opens.
           Only rendered on August 1 (body.anniversary). -->
      <div class="anniv-only">
        <svg class="bq" viewBox="0 0 240 150" aria-hidden="true">
          <!-- stems (draw upward first) -->
          <g stroke="#8AA07F" stroke-width="2.2" stroke-linecap="round" fill="none">
            <path class="stem" pathLength="1" d="M120 104 C120 82 120 60 120 42"/>
            <path class="stem" pathLength="1" d="M113 104 C101 86 90 72 82 60"/>
            <path class="stem" pathLength="1" d="M127 104 C139 86 150 72 158 60"/>
            <path class="stem" pathLength="1" d="M115 106 C107 96 101 90 97 84"/>
            <path class="stem" pathLength="1" d="M125 106 C133 96 139 90 143 84"/>
          </g>

          <!-- leaves -->
          <g class="bqi d2" fill="#A8BBA0">
            <path d="M107 82 C99 78 95 70 96 62 C103 66 107 73 107 82 Z"/>
            <path d="M133 82 C141 78 145 70 144 62 C137 66 133 73 133 82 Z"/>
            <path d="M118 78 C114 72 114 66 117 61 C121 66 121 72 118 78 Z" opacity="0.9"/>
          </g>

          <!-- kraft-paper wrap -->
          <g class="bqi d1">
            <path d="M120 148 L86 96 Q120 110 154 96 Z" fill="#F3E8D2" stroke="#E4DCD1" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M120 148 L103 100" stroke="#E4D6BC" stroke-width="1" fill="none"/>
            <path d="M120 148 L137 100" stroke="#E4D6BC" stroke-width="1" fill="none"/>
          </g>

          <!-- rosebuds -->
          <g class="bqi d3">
            <circle cx="97" cy="82" r="7" fill="#F3D7DA" stroke="#E8C7CB" stroke-width="1"/>
            <path d="M97 82 a3 3 0 0 1 3 3 a4.5 4.5 0 0 1 -6.5 -1.5" fill="none" stroke="#D9A0A5" stroke-width="1.2" stroke-linecap="round"/>
          </g>
          <g class="bqi d4">
            <circle cx="143" cy="82" r="7" fill="#F3D7DA" stroke="#E8C7CB" stroke-width="1"/>
            <path d="M143 82 a3 3 0 0 0 -3 3 a4.5 4.5 0 0 0 6.5 -1.5" fill="none" stroke="#D9A0A5" stroke-width="1.2" stroke-linecap="round"/>
          </g>

          <!-- ribbon bow -->
          <g class="bqi d5">
            <ellipse cx="111" cy="103" rx="8.5" ry="5" fill="#D9A0A5" opacity="0.95" transform="rotate(-18 111 103)"/>
            <ellipse cx="129" cy="103" rx="8.5" ry="5" fill="#D9A0A5" opacity="0.95" transform="rotate(18 129 103)"/>
            <path d="M117 107 C112 118 115 126 110 133" stroke="#D9A0A5" stroke-width="3.4" stroke-linecap="round" fill="none"/>
            <path d="M123 107 C128 118 125 126 130 133" stroke="#D9A0A5" stroke-width="3.4" stroke-linecap="round" fill="none"/>
            <circle cx="120" cy="104" r="3.6" fill="#C88A90"/>
          </g>

          <!-- left lily -->
          <g transform="translate(82 56) rotate(-14) scale(0.4) translate(-50 -50)">
            <g class="bqi d6">
              <g transform="rotate(60 50 50) translate(50 50) scale(0.88) translate(-50 -50)"><path d="M50 50 C43.5 41 40.5 27 44 15 C45.8 8.8 50 4.5 50 4.5 C50 4.5 54.2 8.8 56 15 C59.5 27 56.5 41 50 50 Z" fill="url(#lilyPetalBackG)"/></g>
              <g transform="rotate(180 50 50) translate(50 50) scale(0.88) translate(-50 -50)"><path d="M50 50 C43.5 41 40.5 27 44 15 C45.8 8.8 50 4.5 50 4.5 C50 4.5 54.2 8.8 56 15 C59.5 27 56.5 41 50 50 Z" fill="url(#lilyPetalBackG)"/></g>
              <g transform="rotate(300 50 50) translate(50 50) scale(0.88) translate(-50 -50)"><path d="M50 50 C43.5 41 40.5 27 44 15 C45.8 8.8 50 4.5 50 4.5 C50 4.5 54.2 8.8 56 15 C59.5 27 56.5 41 50 50 Z" fill="url(#lilyPetalBackG)"/></g>
              <g transform="rotate(0 50 50)"><path d="M50 50 C43.5 41 40.5 27 44 15 C45.8 8.8 50 4.5 50 4.5 C50 4.5 54.2 8.8 56 15 C59.5 27 56.5 41 50 50 Z" fill="url(#lilyPetalG)"/><path d="M50 45 C49.5 34 49.5 22 50 9" stroke="#DFA9AE" stroke-width="1" opacity="0.55" fill="none"/></g>
              <g transform="rotate(120 50 50)"><path d="M50 50 C43.5 41 40.5 27 44 15 C45.8 8.8 50 4.5 50 4.5 C50 4.5 54.2 8.8 56 15 C59.5 27 56.5 41 50 50 Z" fill="url(#lilyPetalG)"/><path d="M50 45 C49.5 34 49.5 22 50 9" stroke="#DFA9AE" stroke-width="1" opacity="0.55" fill="none"/></g>
              <g transform="rotate(240 50 50)"><path d="M50 50 C43.5 41 40.5 27 44 15 C45.8 8.8 50 4.5 50 4.5 C50 4.5 54.2 8.8 56 15 C59.5 27 56.5 41 50 50 Z" fill="url(#lilyPetalG)"/><path d="M50 45 C49.5 34 49.5 22 50 9" stroke="#DFA9AE" stroke-width="1" opacity="0.55" fill="none"/></g>
              <circle cx="50" cy="50" r="4" fill="#E6CFA0"/>
              <circle cx="45" cy="47" r="1.8" fill="#C98F3D"/><circle cx="55" cy="47" r="1.8" fill="#C98F3D"/><circle cx="50" cy="55" r="1.8" fill="#C98F3D"/>
            </g>
          </g>

          <!-- right lily -->
          <g transform="translate(158 56) rotate(14) scale(0.4) translate(-50 -50)">
            <g class="bqi d7">

/* ========================= CORE GAME ========================= */
const ROWS = 6, COLS = 5;

const todayDate = new Date();
const mm = String(todayDate.getMonth() + 1).padStart(2, "0");
const dd = String(todayDate.getDate()).padStart(2, "0");

/* ---------- Hidden preview mode (for you, not for Amy) ----------
   Append ?peek=MM-DD to the URL to play any date, e.g.:
     index.html?peek=07-24   → birthday mode
     index.html?peek=12-25   → Christmas
   Add &fresh=1 to wipe that day's saved test progress and replay:
     index.html?peek=07-24&fresh=1
   Preview progress is stored under separate "test-" keys, so testing
   never locks or affects a real day. */
const params = new URLSearchParams(location.search);
const peek = params.get("peek");
const isPeek = !!(peek && /^(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(peek));

const dateKey = isPeek ? peek : `${mm}-${dd}`;
const storageKey = (isPeek ? "test-" : "") + `amy-wordle-${todayDate.getFullYear()}-${dateKey}`;
if (isPeek && params.get("fresh")) {
  try { localStorage.removeItem(storageKey); } catch (e) {}
}

function getToday() {
  const entry = WORDS[dateKey];
  if (entry && entry.word && entry.word.trim().length === 5) {
    return { word: entry.word.toUpperCase(), message: entry.message };
  }
  const start = new Date(todayDate.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((todayDate - start) / 86400000);
  return FALLBACK_WORDS[dayOfYear % FALLBACK_WORDS.length];
}

const today = getToday();
const ANSWER = today.word.toUpperCase();

let currentRow = 0;
let currentGuess = "";
let gameOver = false;
let boardTiles = [];
const keyStates = {};

/* Date line in the header */
document.getElementById("today-line").textContent = isPeek
  ? "preview · " + dateKey
  : todayDate.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });

/* ========================= KEYBOARD ========================= */
const KEY_ROWS = [
  ["Q","W","E","R","T","Y","U","I","O","P"],
  ["A","S","D","F","G","H","J","K","L"],
  ["ENTER","Z","X","C","V","B","N","M","BACK"],
];
const keyboardEl = document.getElementById("keyboard");
const keyEls = {};

KEY_ROWS.forEach((keys) => {
  const rowEl = document.createElement("div");
  rowEl.className = "flex gap-1.5 w-full justify-center";
  keys.forEach((k) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "key" + (k.length > 1 ? " wide" : "");
    btn.textContent = k === "BACK" ? "⌫" : k;
    btn.setAttribute("aria-label", k === "BACK" ? "backspace" : k);
    btn.addEventListener("click", () => handleKey(k));
    rowEl.appendChild(btn);
    keyEls[k] = btn;
  });
  keyboardEl.appendChild(rowEl);
});

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Enter") handleKey("ENTER");
  else if (e.key === "Backspace") handleKey("BACK");
  else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
});

/* ========================= INPUT ========================= */
function handleKey(k) {
  if (gameOver) return;
  if (k === "ENTER") return submitGuess();
  if (k === "BACK") {
    if (currentGuess.length > 0) {
      currentGuess = currentGuess.slice(0, -1);
      const t = boardTiles[currentRow][currentGuess.length];
      t.textContent = "";
      t.classList.remove("filled");
    }
    return;
  }
  if (currentGuess.length < COLS) {
    const t = boardTiles[currentRow][currentGuess.length];
    t.textContent = k;
    t.classList.remove("filled");
    void t.offsetWidth;
    t.classList.add("filled");
    currentGuess += k;
  }
}

/* ========================= EVALUATION ========================= */
function evaluate(guess, answer) {
  const result = new Array(COLS).fill("absent");
  const remaining = {};
  for (let i = 0; i < COLS; i++) {
    if (guess[i] === answer[i]) result[i] = "correct";
    else remaining[answer[i]] = (remaining[answer[i]] || 0) + 1;
  }
  for (let i = 0; i < COLS; i++) {
    if (result[i] === "correct") continue;
    if (remaining[guess[i]] > 0) {
      result[i] = "present";
      remaining[guess[i]]--;
    }
  }
  return result;
}

const RANK = { absent: 0, present: 1, correct: 2 };
function updateKeyStates(guess, result) {
  for (let i = 0; i < COLS; i++) {
    const L = guess[i], s = result[i];
    if (!keyStates[L] || RANK[s] > RANK[keyStates[L]]) keyStates[L] = s;
  }
  Object.entries(keyStates).forEach(([L, s]) => {
    if (keyEls[L]) {
      keyEls[L].classList.remove("correct", "present", "absent");
      keyEls[L].classList.add(s);
    }
  });
}

/* ========================= SUBMIT ========================= */
function submitGuess() {
  if (currentGuess.length < COLS) {
    showToast("Not enough letters, love ☕");
    boardEl.children[currentRow].classList.add("shake");
    setTimeout(() => boardEl.children[currentRow].classList.remove("shake"), 500);
    return;
  }

  const guess = currentGuess;
  const result = evaluate(guess, ANSWER);
  const row = boardTiles[currentRow];
  gameOver = true; // lock input during animation

  row.forEach((tile, i) => {
    setTimeout(() => {
      tile.classList.add("flip");
      setTimeout(() => tile.classList.add(result[i]), 270);
    }, i * 300);
  });

  const totalDelay = COLS * 300 + 300;
  setTimeout(() => {
    updateKeyStates(guess, result);
    const won = guess === ANSWER;
    const rowIndexAtSubmit = currentRow;
    currentRow++;
    currentGuess = "";
    saveState(won ? "won" : currentRow >= ROWS ? "lost" : "playing");

    if (won) {
      row.forEach((tile, i) => setTimeout(() => tile.classList.add("dance"), i * 90));
      petalBurst();
      setTimeout(() => endGame(true, rowIndexAtSubmit + 1), 1000);
    } else if (currentRow >= ROWS) {
      setTimeout(() => endGame(false), 400);
    } else {
      gameOver = false;
    }
  }, totalDelay);
}

/* ========================= VICTORY PETAL BURST ========================= */
const BURST_COLORS = ["var(--sage)", "var(--butter)", "var(--rose)", "var(--blushpk)", "var(--lily)"];
function petalBurst() {
  if (reducedMotion) return;
  const rect = boardEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  for (let i = 0; i < 26; i++) {
    const p = document.createElement("div");
    p.className = "burst";
    const size = 8 + Math.random() * 10;
    p.style.width = size + "px";
    p.style.height = size * 0.75 + "px";
    p.style.left = cx + "px";
    p.style.top = cy + "px";
    p.style.background = BURST_COLORS[i % BURST_COLORS.length];
    const angle = Math.random() * Math.PI * 2;
    const dist = 70 + Math.random() * 150;
    p.style.setProperty("--tx", Math.cos(angle) * dist + "px");
    p.style.setProperty("--ty", (Math.sin(angle) * dist - 60) + "px"); // bias upward
    p.style.setProperty("--rot", (Math.random() * 540 - 270) + "deg");
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1300);
  }
}

/* ========================= ANNIVERSARY FIREWORKS ========================= */
/* Soft fireworks that pop behind the love-note card. The dimmed modal
   backdrop acts as the night sky, so the sparks glow against it.
   Launched every time the note opens on August 1. */
function fireworksShow() {
  if (reducedMotion) return;
  if (document.getElementById("fw-canvas")) return; // one show at a time

  const cv = document.createElement("canvas");
  cv.id = "fw-canvas";
  cv.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;";
  const card = document.getElementById("modal-card");
  backdrop.insertBefore(cv, card);

  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W * DPR;
  cv.height = H * DPR;
  const ctx = cv.getContext("2d");
  ctx.scale(DPR, DPR);

  const COLORS = ["#E8B7BC", "#EFD29A", "#BFD0B6", "#FBE3E5", "#FFF3E2"];
  let rockets = [], sparks = [], launched = 0;
  const LAUNCHES = 6;

  function launch() {
    rockets.push({
      x: W * (0.15 + Math.random() * 0.7),
      y: H + 8,
      vx: (Math.random() - 0.5) * 1.4,
      vy: -(H * 0.0085 + 2 + Math.random() * 1.5),
      color: COLORS[launched % COLORS.length],
    });
    launched++;
    if (launched < LAUNCHES) setTimeout(launch, 420 + Math.random() * 480);
  }

  function explode(x, y, color) {
    const n = 34 + Math.floor(Math.random() * 14);
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.25;
      const sp = 1.6 + Math.random() * 2.4;
      sparks.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 0.011 + Math.random() * 0.011,
        r: 1.4 + Math.random() * 1.3,
        color: Math.random() < 0.7 ? color : "#FFF9F0",
      });
    }
  }

  let raf;
  function frame() {
    ctx.clearRect(0, 0, W, H);

    // rockets: bright streaks climbing
    for (const r of rockets) {
      r.x += r.vx;
      r.y += r.vy;
      r.vy += 0.07; // gravity slows the climb
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(r.x - r.vx * 3, r.y - r.vy * 3);
      ctx.lineTo(r.x, r.y);
      ctx.stroke();
    }
    rockets = rockets.filter(r => {
      if (r.vy >= -1.2 || r.y < H * 0.22) {
        explode(r.x, r.y, r.color);
        return false;
      }
      return true;
    });

    // sparks: glowing embers drifting down
    for (const s of sparks) {
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.035;
      s.vx *= 0.985;
      s.vy *= 0.985;
      s.life -= s.decay;
      if (s.life > 0) {
        ctx.globalAlpha = Math.max(s.life, 0);
        ctx.fillStyle = s.color;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    sparks = sparks.filter(s => s.life > 0);

    if (launched >= LAUNCHES && rockets.length === 0 && sparks.length === 0) {
      cancelAnimationFrame(raf);
      cv.remove();
      return;
    }
    raf = requestAnimationFrame(frame);
  }

  launch();
  raf = requestAnimationFrame(frame);
  setTimeout(() => { // safety cleanup
    if (cv.isConnected) { cancelAnimationFrame(raf); cv.remove(); }
  }, 12000);
}

/* ========================= END / MODAL ========================= */
const WIN_TITLES = ["Genius!", "Brilliant!", "Wonderful!", "Beautiful!", "You did it!", "Just in time!"];

function endGame(won, attempt) {
  gameOver = true;
  const title = dateKey === ANNIVERSARY
    ? "Happy Anniversary!"
    : won
      ? WIN_TITLES[Math.min(attempt - 1, WIN_TITLES.length - 1)]
      : "The word was…";
  openModal(title);
}

const backdrop = document.getElementById("modal-backdrop");
function openModal(title) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-word").textContent = "“" + ANSWER + "”";
  document.getElementById("modal-message").textContent = today.message;
  backdrop.classList.add("show");
  if (dateKey === ANNIVERSARY) fireworksShow();
  startCountdown();
}
document.getElementById("modal-close").addEventListener("click", () => backdrop.classList.remove("show"));
backdrop.addEventListener("click", (e) => { if (e.target === backdrop) backdrop.classList.remove("show"); });

function startCountdown() {
  const el = document.getElementById("countdown");
  function tick() {
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    let s = Math.floor((next - now) / 1000);
    const h = String(Math.floor(s / 3600)).padStart(2, "0");
    const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
    const sec = String(s % 60).padStart(2, "0");
    el.textContent = `${h}:${m}:${sec}`;
  }
  tick();
  setInterval(tick, 1000);
}

/* ========================= TOAST ========================= */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ========================= PERSISTENCE ========================= */
function saveState(status) {
  const guesses = [];
  for (let r = 0; r < currentRow; r++) {
    guesses.push(boardTiles[r].map((t) => t.textContent).join(""));
  }
  try {
    localStorage.setItem(storageKey, JSON.stringify({ guesses, status }));
  } catch (e) { /* private browsing — game still works, just won't persist */ }
}

function restoreState() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem(storageKey)); } catch (e) { return; }
  if (!saved || !Array.isArray(saved.guesses)) return;

  saved.guesses.forEach((guess, r) => {
    const result = evaluate(guess, ANSWER);
    boardTiles[r].forEach((tile, i) => {
      tile.textContent = guess[i];
      tile.classList.add(result[i]);
    });
    updateKeyStates(guess, result);
  });
  currentRow = saved.guesses.length;

  if (saved.status === "won") {
    gameOver = true;
    setTimeout(() => endGame(true, currentRow), 500);
  } else if (saved.status === "lost") {
    gameOver = true;
    setTimeout(() => endGame(false), 500);
  }
}

restoreState();

    5: "boop count: 5 · certified nose-booper",
    10: "boop count: 10. okay. you can stop now.",
    15: "boop count: 15. (don't stop.)",
    25: "boop count: 25 — Awwwwwwwww",
    50: "boop count: 50. I made this for you and this is what you do with it. I love you.",
    100: "boop count: 100. Nothing's going to happen....."
  };

  let boops = 0;
  try { boops = parseInt(localStorage.getItem("amy-boops") || "0", 10) || 0; } catch (e) {}

  function render() { score.textContent = MILESTONES[boops] || "boop count: " + boops; }
  if (boops > 0) { render(); hint.classList.add("gone"); }

  function sparkle(x, y) {
    if (softMotion) return;
    const colors = ["var(--rose)", "var(--blushpk)", "var(--lily)", "var(--butter)"];
    for (let i = 0; i < 10; i++) {
      const p = document.createElement("div");
      p.className = "burst";                    /* reuses the existing petal-burst CSS */
      const s = 6 + Math.random() * 7;
      p.style.width = s + "px";
      p.style.height = s * 0.75 + "px";
      p.style.left = x + "px";
      p.style.top = y + "px";
      p.style.background = colors[i % colors.length];
      const a = Math.random() * Math.PI * 2;
      const d = 30 + Math.random() * 55;
      p.style.setProperty("--tx", Math.cos(a) * d + "px");
      p.style.setProperty("--ty", (Math.sin(a) * d - 25) + "px");
      p.style.setProperty("--rot", (Math.random() * 400 - 200) + "deg");
      document.body.appendChild(p);
      setTimeout(function () { p.remove(); }, 1300);
    }
  }

  /* one boop routine, shared by the big photo and both hanging signs */
  function boop(origin, swingIt) {
    boops++;
    try { localStorage.setItem("amy-boops", String(boops)); } catch (err) {}

    hint.classList.add("gone");
    render();
    score.classList.remove("pop");
    void score.offsetWidth;
    score.classList.add("pop");

    if (swingIt) {
      origin.classList.remove("kick");
      void origin.offsetWidth;
      origin.classList.add("kick");
      setTimeout(function () { origin.classList.remove("kick"); }, 760);
    } else {
      photo.classList.remove("booped");
      void photo.offsetWidth;
      photo.classList.add("booped");
    }

    const r = origin.getBoundingClientRect();
    const x = r.left + r.width / 2;
    const y = r.top + r.height / 2;

    if (!softMotion) {
      const fx = document.createElement("div");
      fx.className = "nd-boop-fx";
      fx.textContent = BOOPS[boops % BOOPS.length];
      fx.style.left = x + (Math.random() * 30 - 15) + "px";
      fx.style.top = y + "px";
      document.body.appendChild(fx);
      setTimeout(function () { fx.remove(); }, 950);
    }
    sparkle(x, y);
  }

  hotspot.addEventListener("click", function () { boop(hotspot, false); });
  plate.querySelectorAll(".nd-sign").forEach(function (sign) {
    sign.addEventListener("click", function () { boop(sign, true); });
  });

  /* ═══════════ 4. the swarm ═══════════ */

  const INK = ["var(--mocha)", "var(--espresso)", "var(--rose)", "var(--sage)", "var(--taupe)"];
  let swarm = null, timers = [];

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  function revealWinner() {
    plate.classList.add("go");
    later(function () {
      if (!backdropEl.classList.contains("show")) return;
      const cardRect = card.getBoundingClientRect();
      const plateRect = plate.getBoundingClientRect();
      if (plateRect.bottom > cardRect.bottom - 10) {
        card.scrollTo({ top: Math.max(0, plate.offsetTop - 30), behavior: "smooth" });
      }
    }, 650);
  }

  function teardown() {
    clearTimers();
    if (swarm) { swarm.remove(); swarm = null; }
  }

  function runSwarm() {
    teardown();
    if (softMotion) { revealWinner(); return; }

    const vw = window.innerWidth, vh = window.innerHeight;
    const STAG = 26;                                   // ms between pops
    const cols = Math.max(4, Math.min(10, Math.round(vw / 84)));
    const rows = Math.max(5, Math.min(9, Math.round(vh / 108)));
    const total = Math.min(84, cols * rows);

    swarm = document.createElement("div");
    swarm.className = "nd-swarm";

    const tally = document.createElement("div");
    tally.className = "nd-tally";
    tally.innerHTML = "<span>noses reviewed</span><b>0</b>";
    swarm.appendChild(tally);
    const tallyNum = tally.querySelector("b");

    const verdict = document.createElement("div");
    verdict.className = "nd-verdict";
    verdict.textContent = "…and then there's yours.";
    swarm.appendChild(verdict);

    const tiles = [];
    for (let i = 0; i < total; i++) {
      const col = i % cols, row = Math.floor(i / cols);
      const w = 46 + Math.random() * 30;
      const h = w * 1.05;
      const cw = vw / cols, ch = vh / rows;
      const x = col * cw + (cw - w) / 2 + (Math.random() * 26 - 13);
      const y = row * ch + (ch - h) / 2 + (Math.random() * 26 - 13);

      const el = document.createElement("div");
      el.className = "nd-tile";
      el.style.left = Math.max(2, Math.min(vw - w - 2, x)) + "px";
      el.style.top = Math.max(2, Math.min(vh - h - 2, y)) + "px";
      el.style.width = w + "px";
      el.style.height = h + "px";
      el.style.setProperty("--rot", (Math.random() * 34 - 17).toFixed(1) + "deg");
      el.style.animationDelay = (i * STAG) + "ms";

      el.style.color = INK[Math.floor(Math.random() * INK.length)];
      el.innerHTML = drawNose(i * 7 + Math.floor(Math.random() * 1000));
      swarm.appendChild(el);
      tiles.push(el);
    }

    document.body.appendChild(swarm);

    /* the tally ticks up as they land */
    for (let i = 1; i <= total; i++) {
      (function (n) { later(function () { tallyNum.textContent = String(n); }, n * STAG + 200); })(i);
    }

    const landed = total * STAG + 300;
    later(function () { verdict.classList.add("show"); }, landed + 250);
    later(function () {
      tiles.forEach(function (el, i) {
        el.style.animationDelay = "0ms";
        later(function () { el.classList.add("drop"); }, i * 9);
      });
    }, landed + 1550);
    later(function () { if (swarm) swarm.classList.add("clearing"); }, landed + 2050);
    later(function () { teardown(); revealWinner(); }, landed + 3050);

    /* tap anywhere to skip the parade */
    swarm.addEventListener("click", function () { teardown(); revealWinner(); });
  }

  /* ═══════════ 5. fire it when the note opens ═══════════ */

  new MutationObserver(function () {
    if (backdropEl.classList.contains("show")) {
      if (titleEl) titleEl.textContent = "Exhibit A";
      runSwarm();
    } else {
      teardown();
      plate.classList.remove("go");   // so it replays if she opens the note again
    }
  }).observe(backdropEl, { attributes: true, attributeFilter: ["class"] });
})();
</script>

    margin-top: 0.05rem;
    min-height: 1.3rem;
  }

  body.toastday .td-actions {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 1rem;
  }
  body.toastday .td-btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 0.45rem 0.95rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--key);
    color: var(--mocha);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.2s ease, color 0.2s ease, transform 0.06s ease;
  }
  body.toastday .td-btn:active { transform: scale(0.95); }
  body.toastday .td-btn.done { background: var(--butter); color: #fff; border-color: var(--butter); }

  body.toastday .td-count {
    text-align: center;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--mocha);
    margin-top: 0.85rem;
    min-height: 1rem;
  }
  body.toastday .td-count.pop { animation: td-pop 0.3s ease; }
  @keyframes td-pop { 50% { transform: scale(1.13); } }

  body.toastday .td-hint {
    text-align: center;
    font-size: 0.72rem;
    color: var(--taupe);
    margin-top: 0.65rem;
    animation: td-pulse 2.4s ease-in-out infinite;
  }
  body.toastday .td-hint.gone { display: none; }
  @keyframes td-pulse { 50% { opacity: 0.45; } }

  /* the little "ding!" that jumps off the toaster */
  body.toastday .td-ding {
    position: fixed;
    z-index: 70;
    pointer-events: none;
    font-family: 'Great Vibes', cursive;
    font-size: 1.5rem;
    color: var(--rose);
    text-shadow: 0 1px 3px rgba(253, 251, 247, 0.9);
    animation: td-float 1s ease-out forwards;
  }
  @keyframes td-float {
    0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
    25%  { transform: translate(-50%, -85%) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -180%) scale(1);  opacity: 0; }
  }

  @media (max-height: 780px) {
    body.toastday .td-machine { transform: scale(0.88); transform-origin: 50% 100%; }
    body.toastday .td { margin-top: 0.9rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    body.toastday .td-holder,
    body.toastday .td-lever { transition: none; }
    body.toastday .td-pat,
    body.toastday .td-smoke i,
    body.toastday .td-hint,
    body.toastday .td-glow,
    body.toastday .td-knife.chop,
    body.toastday .td-ding { animation: none !important; }
    body.toastday .td-jam { animation: none !important; }
  }
</style>

<script>
(function () {
  "use strict";

  /* ── change this one line to move the whole thing to another date ── */
  const TOAST_DAY = "08-25";

  /* where the photos live, relative to index.html — add as many as you like */
  const DIR = "toast/";
  const FACES = ["amy-1.png", "amy-2.png"];

  let dk;
  try { dk = dateKey; } catch (e) { return; }
  if (dk !== TOAST_DAY) return;

  const card = document.getElementById("modal-card");
  const sig = card && card.querySelector(".signature");
  const backdropEl = document.getElementById("modal-backdrop");
  const titleEl = document.getElementById("modal-title");
  if (!card || !sig || !backdropEl) return;

  document.body.classList.add("toastday");

  const sub = document.querySelector("header p");
  if (sub) sub.textContent = "something's in the toaster :)";

  const softMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ═════════ 1. the slice ═════════ */

  const OUTER = "M8 46 C8 21 27 9 50 9 C73 9 92 21 92 46 L92 102 Q92 110 84 110 L16 110 Q8 110 8 102 Z";
  const INNER = "M16 48 C16 28 31 18 50 18 C69 18 84 28 84 48 L84 98 Q84 102 80 102 L20 102 Q16 102 16 98 Z";
  const HEART = "M50 74 C42 66 30 58 30 48 C30 41 36 37 42 38 C46 39 49 42 50 45 C51 42 54 39 58 38 C64 37 70 41 70 48 C70 58 58 66 50 74 Z";

  /* if a photo is missing, this stands in so the toaster still works */
  const PLACEHOLDER =
    "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<rect width="100" height="100" fill="#F3E8D2"/>' +
      '<circle cx="38" cy="42" r="4" fill="#6B5142"/><circle cx="62" cy="42" r="4" fill="#6B5142"/>' +
      '<path d="M34 62 Q50 74 66 62" stroke="#6B5142" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      '<text x="50" y="92" font-family="sans-serif" font-size="7" fill="#A08A72" text-anchor="middle">her face goes here</text>' +
      "</svg>");

  const plate = document.createElement("div");
  plate.className = "td";
  plate.setAttribute("data-level", "3");
  plate.innerHTML =
    '<div class="td-machine">' +
      '<div class="td-holder">' +
        '<svg class="td-bread" viewBox="0 0 100 120" aria-label="a slice of toast with Amy on it">' +
          "<defs>" +
            '<clipPath id="tdCrumb"><path d="' + INNER + '"/></clipPath>' +
            '<radialGradient id="tdVig" cx="50%" cy="46%" r="62%">' +
              '<stop offset="45%" stop-color="#5A3A21" stop-opacity="0"/>' +
              '<stop offset="100%" stop-color="#5A3A21" stop-opacity="0.95"/>' +
            "</radialGradient>" +
            '<radialGradient id="tdMelt" cx="50%" cy="42%" r="55%">' +
              '<stop offset="0%" stop-color="#FFE9A8" stop-opacity="0.95"/>' +
              '<stop offset="70%" stop-color="#F2CE7A" stop-opacity="0.45"/>' +
              '<stop offset="100%" stop-color="#F2CE7A" stop-opacity="0"/>' +
            "</radialGradient>" +
          "</defs>" +
          '<path class="td-crust" d="' + OUTER + '"/>' +
          '<path class="td-crumb" d="' + INNER + '"/>' +
          '<g clip-path="url(#tdCrumb)">' +
            '<image class="td-face" x="12" y="14" width="76" height="94" preserveAspectRatio="xMidYMid slice"/>' +
            '<rect class="td-vig" x="0" y="0" width="100" height="120" fill="url(#tdVig)"/>' +
            '<rect class="td-char" x="0" y="0" width="100" height="120" fill="#2A1A0E"/>' +
            '<ellipse class="td-melt" cx="50" cy="56" rx="40" ry="42" fill="url(#tdMelt)" style="mix-blend-mode:overlay"/>' +
            '<path class="td-jam" d="' + HEART + '" fill="#B33A48" style="mix-blend-mode:multiply"/>' +
          "</g>" +
        "</svg>" +
        '<div class="td-pat"></div>' +
      "</div>" +
      '<div class="td-smoke"><i></i><i></i><i></i></div>' +
      '<div class="td-body">' +
        '<div class="td-slot"></div>' +
        '<div class="td-glow"></div>' +
        '<div class="td-track"></div>' +
        '<button class="td-lever" type="button" aria-label="toast another slice"></button>' +
        '<div class="td-feet"></div>' +
      "</div>" +
    "</div>" +
    '<div class="td-dialrow">' +
      '<span class="td-dl">how do you like it?</span>' +
      '<input class="td-range" type="range" min="1" max="5" step="1" value="3" aria-label="browning dial">' +
      '<span class="td-level"></span>' +
      '<span class="td-verdict"></span>' +
    "</div>" +
    '<div class="td-actions">' +
      '<button class="td-btn" type="button" data-act="butter">add butter</button>' +
      '<button class="td-btn" type="button" data-act="jam">add jam</button>' +
    "</div>" +
    '<p class="td-hint">(pull the lever)</p>' +
    '<p class="td-count" role="status"></p>';
  card.insertBefore(plate, sig);

  const machine = plate.querySelector(".td-machine");
  const holder = plate.querySelector(".td-holder");
  const faceEl = plate.querySelector(".td-face");
  const pat = plate.querySelector(".td-pat");
  const lever = plate.querySelector(".td-lever");
  const range = plate.querySelector(".td-range");
  const levelEl = plate.querySelector(".td-level");
  const verdictEl = plate.querySelector(".td-verdict");
  const hint = plate.querySelector(".td-hint");
  const countEl = plate.querySelector(".td-count");

  function setFace(src) {
    faceEl.setAttribute("href", src);
    faceEl.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", src);
  }

  /* preload, so a missing file falls back quietly instead of showing a gap */
  const sources = [];
  let pending = FACES.length;
  FACES.forEach(function (name, i) {
    const img = new Image();
    img.onload = function () { sources[i] = DIR + name; if (!--pending) ready(); };
    img.onerror = function () { sources[i] = PLACEHOLDER; if (!--pending) ready(); };
    img.src = DIR + name;
  });

  let faceIndex = 0;
  let readyToPop = false;
  let queued = null;
  function ready() {
    setFace(sources[0] || PLACEHOLDER);
    readyToPop = true;
    if (queued !== null) { const f = queued; queued = null; pop(f); }
  }

  /* ═════════ 2. the dial ═════════ */

  const LEVELS = [
    null,
    { name: "barely warm",  line: "raw. bold choice." },
    { name: "golden",       line: "now we're talking." },
    { name: "just right",   line: "perfect. obviously." },
    { name: "well done",    line: "someone likes it crispy." },
    { name: "cremated",     line: "you burnt me. i still love you." }
  ];

  let level = 3;
  try { level = parseInt(localStorage.getItem("amy-toast-level") || "3", 10) || 3; } catch (e) {}
  level = Math.min(5, Math.max(1, level));

  function paint(lv, slow, save) {
    level = lv;
    plate.setAttribute("data-level", String(lv));
    levelEl.textContent = LEVELS[lv].name;
    verdictEl.textContent = LEVELS[lv].line;
    if (save !== false) {
      range.value = String(lv);
      try { localStorage.setItem("amy-toast-level", String(lv)); } catch (e) {}
    }
    if (slow) {
      plate.classList.add("toasting");
      setTimeout(function () { plate.classList.remove("toasting"); }, 1600);
    }
  }
  paint(level, false, true);

  range.addEventListener("input", function () { paint(parseInt(range.value, 10), false, true); });

  /* ═════════ 3. butter and jam ═════════ */

  plate.querySelectorAll(".td-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      const act = btn.getAttribute("data-act");
      if (btn.classList.contains("done")) return;
      btn.classList.add("done");
      if (act === "butter") {
        btn.textContent = "buttered";
        pat.classList.remove("drop");
        void pat.offsetWidth;
        pat.classList.add("drop");
        setTimeout(function () { plate.classList.add("buttered"); }, 850);
      } else {
        btn.textContent = "jammed";
        plate.classList.add("jammed");
      }
    });
  });

  /* ═════════ 4. the lever ═════════ */

  const MILESTONES = {
    1: "slices toasted: 1",
    3: "slices toasted: 3 — breakfast is served",
    5: "slices toasted: 5 · Why are you still cliking",
    10: "slices toasted: 10. you really like this one huh",
    25: "slices toasted: 25. i'm going to run out of bread.",
    50: "slices toasted: 50. WUUUUU. the toaster is tired.",
    100: "Whyd you click to 100....."
  };

  let toasts = 0;
  try { toasts = parseInt(localStorage.getItem("amy-toasts") || "0", 10) || 0; } catch (e) {}
  function renderCount() { countEl.textContent = MILESTONES[toasts] || "slices toasted: " + toasts; }
  if (toasts > 0) { renderCount(); hint.classList.add("gone"); }

  function crumbs() {
    if (softMotion) return;
    const r = holder.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height * 0.75;
    const shades = ["#C4863C", "#9C5F26", "#E9CB96", "#6B5142"];
    for (let i = 0; i < 12; i++) {
      const p = document.createElement("div");
      p.className = "burst";                    /* reuses the petal-burst CSS */
      const s = 3 + Math.random() * 4;
      p.style.width = s + "px";
      p.style.height = s + "px";
      p.style.borderRadius = "2px";
      p.style.left = (cx + (Math.random() * 60 - 30)) + "px";
      p.style.top = cy + "px";
      p.style.background = shades[i % shades.length];
      p.style.setProperty("--tx", (Math.random() * 50 - 25) + "px");
      p.style.setProperty("--ty", (60 + Math.random() * 50) + "px");
      p.style.setProperty("--rot", (Math.random() * 360 - 180) + "deg");
      document.body.appendChild(p);
      setTimeout(function () { p.remove(); }, 1300);
    }
  }

  function ding(text) {
    if (softMotion) return;
    const r = machine.getBoundingClientRect();
    const fx = document.createElement("div");
    fx.className = "td-ding";
    fx.textContent = text;
    fx.style.left = (r.left + r.width / 2 + (Math.random() * 26 - 13)) + "px";
    fx.style.top = (r.top + 24) + "px";
    document.body.appendChild(fx);
    setTimeout(function () { fx.remove(); }, 1050);
  }

  const DINGS = ["ding!", "ding.", "*ding*", "ding!!", "d i n g"];
  let busy = false;

  function pop(first) {
    if (busy) return;
    if (!readyToPop) { queued = first; return; }
    busy = true;
    hint.classList.add("gone");

    holder.classList.remove("up");
    machine.classList.add("heating");
    paint(1, false, false);                             /* starts pale… */

    const wait = softMotion ? 200 : (first ? 900 : 1100);
    setTimeout(function () {
      paint(parseInt(range.value, 10) || level, true, true);  /* …and browns as it heats */
    }, wait * 0.25);

    setTimeout(function () {
      machine.classList.remove("heating");
      holder.classList.add("up");
      ding(DINGS[toasts % DINGS.length]);
      crumbs();
      toasts++;
      try { localStorage.setItem("amy-toasts", String(toasts)); } catch (e) {}
      renderCount();
      countEl.classList.remove("pop");
      void countEl.offsetWidth;
      countEl.classList.add("pop");
      if (typeof petalBurst === "function" && first) petalBurst();
      busy = false;
    }, wait);
  }

  lever.addEventListener("click", function () {
    if (busy) return;
    faceIndex = (faceIndex + 1) % sources.length;
    setFace(sources[faceIndex] || PLACEHOLDER);
    plate.classList.remove("buttered", "jammed");
    plate.querySelectorAll(".td-btn").forEach(function (b) {
      b.classList.remove("done");
      b.textContent = b.getAttribute("data-act") === "butter" ? "add butter" : "add jam";
    });
    pop(false);
  });

  /* ═════════ 5. the loaf, before any of that ═════════ */

  let stage = null, timers = [];
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  function teardown() {
    clearTimers();
    if (stage) { stage.remove(); stage = null; }
  }

  function reveal() {
    teardown();
    later(function () {
      if (!backdropEl.classList.contains("show")) return;
      const cardRect = card.getBoundingClientRect();
      const plateRect = plate.getBoundingClientRect();
      if (plateRect.bottom > cardRect.bottom - 10) {
        card.scrollTo({ top: Math.max(0, plate.offsetTop - 30), behavior: "smooth" });
      }
    }, 300);
    later(function () { pop(true); }, softMotion ? 100 : 520);
  }

  function runLoaf() {
    teardown();
    if (softMotion) { reveal(); return; }

    stage = document.createElement("div");
    stage.className = "td-stage";
    stage.innerHTML =
      '<div class="td-plate">' +
        '<div class="td-cut" style="left:16px"></div>' +
        '<div class="td-cut" style="left:52px"></div>' +
        '<div class="td-cut" style="left:88px"></div>' +
        '<div class="td-loaf"></div>' +
        '<div class="td-knife">' +
          '<svg viewBox="0 0 176 40" aria-hidden="true">' +
            '<path d="M4 22 L120 14 Q134 15 134 22 Q134 29 120 30 L4 26 Z" fill="#DDE1E4" stroke="#BFC6CB" stroke-width="1.4"/>' +
            '<path d="M8 25 L120 28" stroke="#FFFFFF" stroke-width="1.6" opacity="0.9"/>' +
            '<rect x="132" y="14" width="40" height="15" rx="6" fill="#3E2C23"/>' +
            '<circle cx="152" cy="21.5" r="1.6" fill="#8A6A50"/><circle cx="162" cy="21.5" r="1.6" fill="#8A6A50"/>' +
          "</svg>" +
        "</div>" +
        '<div class="td-board"></div>' +
      "</div>" +
      '<p class="td-cap"></p>' +
      '<p class="td-skip">tap to skip</p>';
    document.body.appendChild(stage);

    const loaf = stage.querySelector(".td-loaf");
    const cuts = stage.querySelectorAll(".td-cut");
    const knife = stage.querySelector(".td-knife");
    const cap = stage.querySelector(".td-cap");

    /* fit the scene to small screens */
    stage.querySelector(".td-plate").style.setProperty(
      "--pscale", Math.min(1, (window.innerWidth - 40) / 320).toFixed(2));

    function say(text) {
      cap.classList.remove("show");
      later(function () { cap.textContent = text; cap.classList.add("show"); }, 220);
    }

    later(function () { knife.classList.add("in"); }, 350);
    later(function () { say("a whole loaf. every slice the same."); }, 500);

    [0, 1, 2].forEach(function (i) {
      const t = 900 + i * 620;
      later(function () {
        knife.classList.remove("chop");
        void knife.offsetWidth;
        knife.classList.add("chop");
      }, t);
      later(function () {
        loaf.style.width = (152 - (i + 1) * 30) + "px";
        cuts[i].classList.add("out");
        cuts[i].style.transform = "translateX(0) rotate(" + (i === 1 ? -4 : i === 2 ? 5 : -2) + "deg)";
      }, t + 230);
    });

    later(function () { knife.classList.remove("in"); }, 2600);
    later(function () { say("…except one."); }, 2900);

    /* the chosen slice grows, then flies up into the toaster */
    later(function () {
      loaf.style.opacity = "0";
      loaf.style.transition = "opacity 0.4s ease, width 0.42s";
      cuts[0].style.opacity = "0";
      cuts[2].style.opacity = "0";
      const hero = cuts[1];
      hero.style.transition = "transform 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.2)";
      hero.style.transform = "translate(93px, -22px) scale(1.85) rotate(0deg)";
    }, 3450);

    later(function () {
      const hero = cuts[1];
      hero.style.transition = "transform 0.8s cubic-bezier(0.5, 0, 0.7, 0.2), opacity 0.4s ease 0.45s";
      hero.style.transform = "translate(93px, -" + (window.innerHeight * 0.75) + "px) scale(1.1) rotate(6deg)";
      hero.style.opacity = "0";
      cap.classList.remove("show");
    }, 4450);

    later(function () {
      if (stage) stage.classList.add("clearing");
    }, 4900);
    later(reveal, 5350);

    stage.addEventListener("click", reveal);
  }

  /* ═════════ 6. fire it when the note opens ═════════ */

  new MutationObserver(function () {
    if (backdropEl.classList.contains("show")) {
      if (titleEl) titleEl.textContent = "Golden brown.";
      holder.classList.remove("up");
      plate.classList.remove("buttered", "jammed");
      plate.querySelectorAll(".td-btn").forEach(function (b) {
        b.classList.remove("done");
        b.textContent = b.getAttribute("data-act") === "butter" ? "add butter" : "add jam";
      });
      runLoaf();
    } else {
      teardown();
      busy = false;
      holder.classList.remove("up");
      machine.classList.remove("heating");
    }
  }).observe(backdropEl, { attributes: true, attributeFilter: ["class"] });
})();
</script>
